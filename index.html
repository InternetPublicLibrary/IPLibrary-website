<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internet Public Library</title>
  <meta name="description" content="A free, curated and multilingual library of internet resources, maintained by volunteers.">
  <link rel="alternate" hreflang="en-US" href="/en-US/">
  <link rel="alternate" hreflang="pt-BR" href="/pt-BR/">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <script>
    // Send readers to their language edition. replace() keeps this page out of the history, so Back works.
    (function () {
      var editions = ['en-US', 'pt-BR'];
      var target = 'en-US';
      var browser = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if (browser.indexOf('pt') === 0) target = 'pt-BR';
      try {
        var stored = localStorage.getItem('preferred_language');
        if (editions.indexOf(stored) > -1) target = stored;
      } catch (error) { /* storage unavailable: use the browser language */ }
      window.location.replace('/' + target + '/');
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/primitives.css">
  <style>
    .ipl-gate { min-height: 100vh; display: grid; place-items: center; padding: var(--space-4); }
    .ipl-gate__box { max-width: 32rem; text-align: center; }
    .ipl-gate__title { margin: var(--space-4) 0 var(--space-2); font: var(--weight-semibold) var(--text-2xl) / var(--leading-tight) var(--font-heading); }
    .ipl-gate__text { margin: 0 0 var(--space-6); color: var(--color-muted); }
  </style>
</head>
<body>
  <main class="ipl-gate">
    <div class="ipl-gate__box">
      {% include components/atoms/brand-mark.html size="64" %}
      <h1 class="ipl-gate__title">Internet Public Library</h1>
      <p class="ipl-gate__text">Choose your language · <span lang="pt-BR">Escolha seu idioma</span></p>
      <div class="ipl-cluster" style="justify-content: center">
        <a class="ipl-button ipl-button--primary" href="/en-US/" hreflang="en-US">English</a>
        <a class="ipl-button" href="/pt-BR/" hreflang="pt-BR" lang="pt-BR">Português</a>
      </div>
    </div>
  </main>
</body>
</html>
