- name: "Designing Data-Intensive Applications"
  url: "https://dataintensive.net/"
  description: "An authoritative guide by Martin Kleppmann exploring principles of distributed databases, stream processing, and storage systems."
  type: "textbook"
  access: "paid"
  organization: "O'Reilly Media"

- name: "DataCamp"
  url: "https://www.datacamp.com/"
  description: "An interactive online learning platform providing courses and certifications in big data, SQL, Python, and data engineering."
  type: "course"
  access: "freemium"
  organization: "DataCamp"

- name: "Distributed Systems"
  url: "https://www.distributed-systems.net/"
  description: "A free online textbook by Maarten van Steen and Andrew S. Tanenbaum covering principles and paradigms of distributed computing."
  type: "textbook"
  access: "free"
  organization: "Distributed Systems Net"

- name: "Google Cloud Big Data Documentation"
  url: "https://cloud.google.com/docs"
  description: "Official documentation and architectural patterns for petabyte-scale analytics, BigQuery, and distributed streaming engines."
  type: "reference"
  access: "free"
  organization: "Google Cloud"

- name: "BigQuery Documentation"
  url: "https://docs.cloud.google.com/bigquery/docs"
  description: "Official documentation for Google BigQuery, the serverless data warehouse, including guides to SQL queries, user-defined functions, loading data and administration."
  type: "reference"
  access: "free"
  organization: "Google Cloud"

- name: "Data Engineer Roadmap (roadmap.sh)"
  url: "https://roadmap.sh/data-engineer"
  description: "Interactive roadmap on data engineering: topics laid out in a suggested study order, each linking to further reading."
  type: "reference"
  access: "free"
  organization: "roadmap.sh"
