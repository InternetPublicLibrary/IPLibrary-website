- name: "Common Crawl"
  url: "https://commoncrawl.org/"
  description: "An open repository of web crawl data providing petabytes of freely accessible web archives for large-scale analysis."
  type: "database"
  access: "free"
  organization: "Common Crawl Foundation"

- name: "Registry of Open Data on AWS"
  url: "https://registry.opendata.aws/"
  description: "A public registry of large-scale open datasets hosted on Amazon Web Services spanning science, health, and geospatial data."
  type: "database"
  access: "free"
  organization: "Amazon Web Services"

- name: "Data.gov"
  url: "https://www.data.gov/"
  description: "The United States government's open data repository providing access to hundreds of thousands of public datasets."
  type: "database"
  access: "free"
  organization: "U.S. General Services Administration"

- name: "Kaggle Datasets"
  url: "https://www.kaggle.com/datasets"
  description: "A community platform hosting hundreds of thousands of open tabular, text, and multimodal datasets for analytical research."
  type: "database"
  access: "free"
  organization: "Kaggle"
