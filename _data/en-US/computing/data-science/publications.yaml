- name: "Journal of Machine Learning Research"
  url: "https://www.jmlr.org/"
  description: "An open-access peer-reviewed journal publishing research on algorithms, statistical theory, and empirical data science."
  type: "journal"
  access: "free"
  organization: "JMLR"

- name: "IEEE Transactions on Knowledge and Data Engineering"
  url: "https://ieeexplore.ieee.org/"
  description: "A monthly peer-reviewed journal publishing research on database systems, data mining, and large-scale data engineering."
  type: "journal"
  access: "paid"
  organization: "IEEE Computer Society"

- name: "ACM Transactions on Knowledge Discovery from Data (TKDD)"
  url: "https://dl.acm.org/"
  description: "A scholarly quarterly journal focusing on algorithms, applications, and theoretical foundations of data mining and discovery."
  type: "journal"
  access: "free"
  organization: "Association for Computing Machinery"

- name: "SIAM Journal on Mathematics of Data Science (SIMODS)"
  url: "https://www.siam.org/"
  description: "A peer-reviewed journal publishing mathematical, statistical, and computational research fundamental to data science."
  type: "journal"
  access: "paid"
  organization: "Society for Industrial and Applied Mathematics"
