- name: "Designing Data-Intensive Applications"
  url: "https://dataintensive.net/"
  description: "Comprehensive book by Martin Kleppmann exploring principles, architectures, and trade-offs of distributed data systems."
  type: "textbook"
  access: "paid"
  organization: "Martin Kleppmann / O'Reilly"

- name: "Distributed Systems (van Steen and Tanenbaum)"
  url: "https://www.distributed-systems.net/"
  description: "Foundational computer science textbook covering architectures, processes, communication, coordination, and fault tolerance in distributed systems."
  type: "textbook"
  access: "free"
  organization: "Maarten van Steen and Andrew S. Tanenbaum"

- name: "Kubernetes Documentation"
  url: "https://kubernetes.io/docs/"
  description: "Official guide and reference documentation for container orchestration, cluster architecture, and distributed service management."
  type: "reference"
  access: "free"
  organization: "Cloud Native Computing Foundation"

- name: "Apache Spark Documentation"
  url: "https://spark.apache.org/docs/"
  description: "Official reference and programming guides for scalable cluster computing and distributed data processing with Apache Spark."
  type: "reference"
  access: "free"
  organization: "Apache Software Foundation"

- name: "Cloud Run Documentation"
  url: "https://docs.cloud.google.com/run/docs"
  description: "Google Cloud documentation for Cloud Run, a managed platform for running containers, covering deployment from source, the container contract and configuration."
  type: "reference"
  access: "free"
  organization: "Google Cloud"

- name: "Cloud Architecture Center"
  url: "https://docs.cloud.google.com/architecture"
  description: "Google Cloud collection of reference architectures, design guides and best practices for building reliable, secure and scalable systems in the cloud."
  type: "reference"
  access: "free"
  organization: "Google Cloud"

- name: "A Gentle Introduction to Blockchain Technology"
  url: "https://bitsonblocks.net/2015/09/09/gentle-introduction-blockchain-technology/"
  description: "Plain-language explainer of how blockchains, distributed ledgers and consensus work, aimed at business readers and students without a technical background."
  type: "reference"
  access: "free"
  organization: "Bits on Blocks"

- name: "Minimum Viable Block Chain"
  url: "https://www.igvita.com/2014/05/05/minimum-viable-block-chain/"
  description: "Step-by-step essay that builds up the design of a blockchain from first principles, explaining signatures, proof of work and double-spend protection for engineers."
  type: "reference"
  access: "free"
  organization: "igvita.com"

- name: "AWS Roadmap (roadmap.sh)"
  url: "https://roadmap.sh/aws"
  description: "Interactive roadmap on Amazon Web Services: topics laid out in a suggested study order, each linking to further reading."
  type: "reference"
  access: "free"
  organization: "roadmap.sh"

- name: "Cloudflare Roadmap (roadmap.sh)"
  url: "https://roadmap.sh/cloudflare"
  description: "Interactive roadmap on building on the Cloudflare platform: topics laid out in a suggested study order, each linking to further reading."
  type: "reference"
  access: "free"
