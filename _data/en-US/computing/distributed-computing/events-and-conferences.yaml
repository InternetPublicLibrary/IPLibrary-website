- name: "USENIX Symposium on Operating Systems Design and Implementation (OSDI)"
  url: "https://www.usenix.org/"
  description: "Premier academic conference bringing together researchers and system builders to present innovative research on distributed and operating systems."
  type: "conference"
  access: "free"
  organization: "USENIX Association"

- name: "ACM Symposium on Operating Systems Principles (SOSP)"
  url: "https://www.sosp.org/"
  description: "Flagship bi-annual conference presenting foundational and state-of-the-art research on operating and distributed computing systems."
  type: "conference"
  access: "free"
  organization: "ACM SIGOPS"

- name: "ACM Symposium on Principles of Distributed Computing (PODC)"
  url: "https://www.podc.org/"
  description: "Premier annual international forum for foundational research on the theory, design, and analysis of distributed systems."
  type: "conference"
  access: "free"
  organization: "ACM SIGACT / SIGOPS"

- name: "IEEE International Conference on Distributed Computing Systems (ICDCS)"
  url: "https://www.computer.org/"
  description: "Annual academic conference focusing on advancements in distributed algorithms, cloud computing, and distributed storage systems."
  type: "conference"
  access: "paid"
  organization: "IEEE Computer Society"
