- name: "IEEE Transactions on Parallel and Distributed Systems"
  url: "https://ieeexplore.ieee.org/"
  description: "Premier academic journal publishing research on parallel architectures, distributed algorithms, fault tolerance, and cloud computing."
  type: "journal"
  access: "paid"
  organization: "IEEE Computer Society"

- name: "Communications of the ACM"
  url: "https://cacm.acm.org/"
  description: "Flagship monthly print and online publication of the ACM covering critical computing breakthroughs, distributed architectures, and software systems."
  type: "journal"
  access: "free"
  organization: "Association for Computing Machinery"

- name: "arXiv Distributed, Parallel, and Cluster Computing (cs.DC)"
  url: "https://arxiv.org/list/cs.DC/recent"
