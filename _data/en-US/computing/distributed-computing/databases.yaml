- name: "Common Crawl"
  url: "https://commoncrawl.org/"
  description: "Open repository of web crawl data petabytes in size, widely used for distributed processing benchmarks and training web-scale models."
  type: "database"
  access: "free"
  organization: "Common Crawl Foundation"

- name: "Registry of Open Data on AWS"
  url: "https://registry.opendata.aws/"
  description: "Repository of large-scale open datasets hosted for distributed analytics, high-performance computing, and machine learning."
  type: "database"
  access: "free"
  organization: "Amazon Web Services"

- name: "Data.gov"
  url: "https://www.data.gov/"
  description: "The United States government open data repository, offering hundreds of thousands of datasets across scientific, social, and economic domains."
  type: "database"
  access: "free"
  organization: "U.S. General Services Administration"

- name: "Kaggle Datasets"
  url: "https://www.kaggle.com/datasets"
  description: "Public community platform hosting thousands of diverse datasets for distributed analysis and predictive modeling."
  type: "database"
  access: "free"
  organization: "Kaggle"
