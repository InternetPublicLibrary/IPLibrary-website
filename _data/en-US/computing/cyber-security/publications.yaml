- name: "ACM Transactions on Privacy and Security (TOPS)"
  url: "https://dl.acm.org/journal/tops"
  description: "An open-access peer-reviewed academic journal publishing research in information security, cryptography, and privacy."
  type: "journal"
  access: "free"
  organization: "Association for Computing Machinery"

- name: "IEEE Security & Privacy Magazine"
  url: "https://www.computer.org/csdl/magazine/sp"
  description: "A bimonthly publication by IEEE Computer Society offering articles, case studies, and research on security and privacy engineering."
  type: "journal"
  access: "paid"
  organization: "IEEE Computer Society"

- name: "IEEE Transactions on Information Forensics and Security"
  url: "https://ieeexplore.ieee.org/"
  description: "A premier monthly scientific journal publishing peer-reviewed research on computer forensics, malware analysis, and information protection."
  type: "journal"
  access: "paid"
  organization: "IEEE"

- name: "CISA Cybersecurity Advisories"
  url: "https://www.cisa.gov/news-events/cybersecurity-advisories"
  description: "Official timely alerts and threat analyses published by CISA regarding current security issues and active cyber threats."
  type: "reference"
  access: "free"
  organization: "Cybersecurity and Infrastructure Security Agency"

- name: "Compromising LLM-Integrated Applications with Indirect Prompt Injection"
  url: "https://arxiv.org/abs/2302.12173"
  description: "Research paper showing how instructions hidden in retrieved web content can hijack applications built on language models, and classifying the resulting threats."
  type: "publication"
  access: "free"
  organization: "arXiv"

- name: "Universal and Transferable Attacks on Aligned Language Models"
  url: "https://llm-attacks.org/"
  description: "Project site for research demonstrating automatically generated adversarial suffixes that bypass safety training across many language models, with paper and code."
  type: "publication"
  access: "free"
  organization: "Carnegie Mellon University"
