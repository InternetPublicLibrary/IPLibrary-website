- name: "National Vulnerability Database (NVD)"
  url: "https://nvd.nist.gov/"
  description: "The U.S. government repository of standards-based vulnerability management data, security checklists, and impact metrics."
  type: "database"
  access: "free"
  organization: "National Institute of Standards and Technology"

- name: "MITRE ATT&CK"
  url: "https://attack.mitre.org/"
  description: "A globally accessible knowledge base of adversary tactics and techniques based on real-world cybersecurity observations."
  type: "database"
  access: "free"
  organization: "The MITRE Corporation"

- name: "CVE Program"
  url: "https://www.cve.org/"
  description: "A global standard catalog identifying and indexing publicly disclosed cybersecurity vulnerabilities."
  type: "database"
  access: "free"
  organization: "The MITRE Corporation"

- name: "CISA Known Exploited Vulnerabilities Catalog"
  url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
  description: "An authoritative list of vulnerabilities confirmed by CISA to have been actively exploited by threat actors in the wild."
  type: "database"
  access: "free"
  organization: "Cybersecurity and Infrastructure Security Agency"
