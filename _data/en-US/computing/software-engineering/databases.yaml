- name: "CVE (Common Vulnerabilities and Exposures)"
  url: "https://www.cve.org/"
  description: "An international standardized catalog and database identifying publicly disclosed cybersecurity vulnerabilities in software."
  type: "database"
  access: "free"
  organization: "The MITRE Corporation"

- name: "CWE (Common Weakness Enumeration)"
  url: "https://cwe.mitre.org/"
  description: "A community-developed taxonomy and dictionary of common software security architecture and implementation weaknesses."
  type: "database"
  access: "free"
  organization: "The MITRE Corporation"

- name: "OSV (Open Source Vulnerabilities)"
  url: "https://osv.dev/"
  description: "An open, distributed vulnerability database aggregating and matching security advisories across open-source package ecosystems."
  type: "database"
  access: "free"
  organization: "Google"
