- name: "ISCA (International Symposium on Computer Architecture)"
  url: "https://iscaconf.org/"
  description: "The flagship annual conference for novel ideas and experimental results in computer architecture and processor design."
  type: "conference"
  access: "paid"
  organization: "ACM SIGARCH and IEEE TCCA"

- name: "MICRO (IEEE/ACM International Symposium on Microarchitecture)"
  url: "https://microarch.org/"
  description: "A premier international forum presenting microarchitecture innovations, compilers, and hardware-software interfaces."
  type: "conference"
  access: "paid"
  organization: "IEEE Computer Society and ACM SIGMICRO"

- name: "ASPLOS (Architectural Support for Programming Languages and Operating Systems)"
  url: "https://www.asplos-conference.org/"
  description: "A premier interdisciplinary conference exploring the intersection of computer hardware, languages, and operating systems."
  type: "conference"
  access: "paid"
  organization: "Association for Computing Machinery"

- name: "DAC (Design Automation Conference)"
  url: "https://www.dac.com/"
  description: "An annual technical conference and exhibition dedicated to electronic design automation and embedded systems hardware."
  type: "conference"
  access: "paid"
  organization: "ACM SIGDA and IEEE CEDA"

- name: "ISFPGA (ACM/SIGDA International Symposium on Field-Programmable Gate Arrays)"
  url: "https://www.isfpga.org/"
  description: "The primary annual symposium focused on advancements in field-programmable gate array technology and reconfigurable computing."
  type: "conference"
  access: "paid"
  organization: "ACM SIGDA"
