- name: "OpenML"
  url: "https://www.openml.org/"
  description: "An open, collaborative scientific platform and database for sharing machine learning datasets, tasks, and empirical experiments."
  type: "database"
  access: "free"
  organization: "OpenML Foundation"

- name: "UCI Machine Learning Repository"
  url: "https://archive.ics.uci.edu/"
  description: "A longstanding open archive providing curated benchmark datasets for empirical machine learning research."
  type: "database"
  access: "free"
  organization: "University of California, Irvine"

- name: "Hugging Face Datasets"
  url: "https://huggingface.co/datasets"
  description: "A community-driven hub and library hosting tens of thousands of datasets for machine learning training and evaluation."
  type: "database"
  access: "free"
  organization: "Hugging Face"

- name: "OpenReview"
  url: "https://openreview.net/"
  description: "An open peer-review database and scientific publishing repository for research papers presented at major machine learning venues."
  type: "database"
  access: "free"
  organization: "OpenReview"
