- name: "Language Models are Few-Shot Learners"
  url: "https://arxiv.org/abs/2005.14165"
  description: "Research paper introducing GPT-3 and showing how a large language model performs new tasks from a few examples given in its prompt."
  type: "publication"
  access: "free"
  organization: "OpenAI"

- name: "Improving Language Understanding by Generative Pre-Training"
  url: "https://cdn.openai.com/research-covers/language-unsupervised/language_understanding_paper.pdf"
  description: "The 2018 paper describing the first GPT model, which combined unsupervised pre-training of a transformer with supervised fine-tuning on language tasks."
  type: "publication"
  access: "free"
  organization: "OpenAI"

- name: "Language Models are Unsupervised Multitask Learners"
  url: "https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf"
  description: "The 2019 paper introducing GPT-2 and showing that a large language model trained on web text can perform many tasks without task-specific training."
  type: "publication"
  access: "free"
  organization: "OpenAI"
