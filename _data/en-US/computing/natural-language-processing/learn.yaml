- name: "Stanford CS224N: Natural Language Processing with Deep Learning"
  url: "https://web.stanford.edu/class/cs224n/"
  description: "Lecture notes, assignments, and slides covering neural network architectures for natural language processing from Stanford University."
  type: "course"
  access: "free"
  organization: "Stanford University"

- name: "Speech and Language Processing (Jurafsky & Martin)"
  url: "https://web.stanford.edu/~jurafsky/slp3/"
  description: "The authoritative textbook draft on computational linguistics, speech processing, and natural language understanding."
  type: "textbook"
  access: "free"
  organization: "Stanford University and University of Colorado Boulder"

- name: "Hugging Face NLP Course"
  url: "https://huggingface.co/learn/nlp-course"
  description: "A hands-on, open-access course teaching practical transformer workflows, fine-tuning, and model deployment."
  type: "course"
  access: "free"
  organization: "Hugging Face"

- name: "The Illustrated Transformer"
  url: "https://jalammar.github.io/illustrated-transformer/"
  description: "Heavily illustrated walkthrough of the transformer architecture, explaining attention, encoders and decoders visually for students new to modern language models."
  type: "tutorial"
  access: "free"
  organization: "The Illustrated Transformer"

- name: "Transformer: A Novel Neural Network Architecture for Language Understanding"
  url: "https://research.google/blog/transformer-a-novel-neural-network-architecture-for-language-understanding/"
  description: "Google Research blog post introducing the transformer model and explaining in accessible terms why self-attention improved machine translation."
  type: "reference"
  access: "free"
  organization: "Google Research"

- name: "GPT in 60 Lines of NumPy"
  url: "https://jaykmody.com/blog/gpt-from-scratch"
  description: "Hands-on tutorial that implements the forward pass of a GPT language model in a short NumPy program, aimed at programmers learning how GPT works."
  type: "tutorial"
  access: "free"
  organization: "GPT in 60 Lines of NumPy"

- name: "The Annotated Transformer"
  url: "https://nlp.seas.harvard.edu/annotated-transformer/"
  description: "Line-by-line annotated PyTorch implementation of the original transformer paper, pairing the text of the paper with working code for students and researchers."
  type: "tutorial"
  access: "free"
  organization: "Harvard NLP"

- name: "LLM University"
  url: "https://docs.cohere.com/docs/llmu-2"
  description: "Free self-paced course on large language models covering embeddings, text generation, retrieval-augmented generation and deployment for developers building language applications."
  type: "course"
  access: "free"
  organization: "Cohere"

- name: "Prompt Engineering Roadmap (roadmap.sh)"
  url: "https://roadmap.sh/prompt-engineering"
  description: "Interactive roadmap on prompting language models: topics laid out in a suggested study order, each linking to further reading."
  type: "reference"
  access: "free"
  organization: "roadmap.sh"
