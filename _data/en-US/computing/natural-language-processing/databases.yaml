- name: "WordNet"
  url: "https://wordnet.princeton.edu/"
  description: "A large lexical database of English nouns, verbs, adjectives, and adverbs grouped into sets of cognitive synonyms."
  type: "database"
  access: "free"
  organization: "Princeton University"

- name: "ACL Anthology"
  url: "https://aclanthology.org/"
  description: "A comprehensive digital archive hosting open-access scientific papers published across all major NLP and computational linguistics venues."
  type: "database"
  access: "free"
  organization: "Association for Computational Linguistics"

- name: "Universal Dependencies"
  url: "https://universaldependencies.org/"
  description: "A cross-linguistically consistent treebank annotation database spanning more than one hundred human languages."
  type: "database"
  access: "free"
  organization: "Universal Dependencies Consortium"

- name: "Hugging Face Hub"
  url: "https://huggingface.co/models"
  description: "A repository of open-access pre-trained natural language processing models, embeddings, and tokenizers."
  type: "database"
  access: "free"
  organization: "Hugging Face"
