  organization: "IEEE"

- name: "Robotics: Science and Systems Online Proceedings"
  url: "https://www.roboticsproceedings.org/"
  description: "An open-access digital archive containing all research papers and presentations published at the annual RSS conferences."
  type: "database"
  access: "free"
  organization: "Robotics: Science and Systems Foundation"
