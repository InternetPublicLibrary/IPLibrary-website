- name: "ACM Transactions on Database Systems (TODS)"
  url: "https://dl.acm.org/journal/tods"
  description: "An open-access peer-reviewed academic journal covering theoretical principles and system architectures for database management."
  type: "journal"
  access: "free"
  organization: "Association for Computing Machinery"

- name: "Proceedings of the VLDB Endowment"
  url: "https://www.vldb.org/"
  description: "A monthly publication presenting peer-reviewed research on database engines, transaction processing, and big data systems."
  type: "journal"
  access: "free"
  organization: "VLDB Endowment"

- name: "IEEE Transactions on Knowledge and Data Engineering"
  url: "https://ieeexplore.ieee.org/"
  description: "A research journal focusing on data models, query languages, database indexing, and distributed data systems."
  type: "journal"
  access: "paid"
  organization: "IEEE Computer Society"

- name: "ACM Transactions on Storage (TOS)"
  url: "https://dl.acm.org/journal/tos"
  description: "An open-access journal covering storage system architectures, file systems, flash memory, and durable storage design."
  type: "journal"
  access: "free"
  organization: "Association for Computing Machinery"
