- name: "Use The Index, Luke!"
  url: "https://use-the-index-luke.com/"
  description: "A developer-oriented guide by Markus Winand explaining database indexing mechanics and SQL performance tuning."
  type: "textbook"
  access: "free"
  organization: "Markus Winand"

- name: "Designing Data-Intensive Applications"
  url: "https://dataintensive.net/"
  description: "A foundational text by Martin Kleppmann examining storage engines, indexing algorithms, replication, and transactions."
  type: "textbook"
  access: "paid"
  organization: "O'Reilly Media"

- name: "PostgreSQL Documentation"
  url: "https://www.postgresql.org/docs/"
  description: "Official comprehensive manual detailing relational database concepts, write-ahead logging, MVCC, and SQL syntax."
  type: "reference"
  access: "free"
  organization: "PostgreSQL Global Development Group"

- name: "SQLite Documentation"
  url: "https://www.sqlite.org/"
  description: "Official architectural documentation covering embedded database internals, file formats, and zero-configuration design."
  type: "reference"
  access: "free"
  organization: "SQLite Consortium"

- name: "Elasticsearch Roadmap (roadmap.sh)"
  url: "https://roadmap.sh/elasticsearch"
  description: "Interactive roadmap on search with Elasticsearch: topics laid out in a suggested study order, each linking to further reading."
  type: "reference"
  access: "free"
  organization: "roadmap.sh"
