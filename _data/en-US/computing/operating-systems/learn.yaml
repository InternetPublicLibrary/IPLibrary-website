- name: "Operating Systems: Three Easy Pieces (OSTEP)"
  url: "https://pages.cs.wisc.edu/~remzi/OSTEP/"
  description: "A free, widely-used modern textbook explaining virtualization, concurrency, and persistence in operating systems."
  type: "textbook"
  access: "free"
  organization: "University of Wisconsin-Madison"

- name: "MIT 6.S081 / 6.1810: Operating System Engineering"
  url: "https://pdos.csail.mit.edu/6.828/"
  description: "Open educational course materials and hands-on laboratory exercises based on the xv6 teaching operating system kernel."
  type: "course"
  access: "free"
  organization: "Massachusetts Institute of Technology"

- name: "The Linux Command Line (William Shotts)"
  url: "https://linuxcommand.org/"
  description: "A comprehensive free learning resource and complete textbook introducing shell scripting and Linux system administration."
  type: "textbook"
  access: "free"
  organization: "LinuxCommand.org"

- name: "Apple Hypervisor Framework Documentation"
  url: "https://developer.apple.com/documentation/hypervisor"
  description: "Apple developer reference for the Hypervisor framework, which lets macOS applications build virtualization solutions without third-party kernel extensions."
  type: "reference"
  access: "free"
  organization: "Apple"

- name: "ArchWiki"
  url: "https://wiki.archlinux.org"
  description: "Community-maintained wiki of Arch Linux documentation whose detailed articles on configuration and software are widely used by users of any Linux distribution."
  type: "reference"
  access: "free"
  organization: "Arch Linux"

- name: "Debian Documentation"
  url: "https://www.debian.org/doc/"
  description: "Collection of official Debian manuals, including installation, administration and packaging guides for users and prospective package maintainers."
  type: "reference"
  access: "free"
  organization: "Debian"

- name: "NixOS Manual"
  url: "https://nixos.org/manual/nixos/stable/index.html"
  description: "Official manual for NixOS, a Linux distribution configured declaratively with the Nix package manager, covering installation, configuration and administration."
  type: "reference"
  access: "free"
  organization: "NixOS"

- name: "PowerShell Documentation"
  url: "https://learn.microsoft.com/en-us/powershell/"
  description: "Official Microsoft documentation for PowerShell, covering the shell, scripting language, cmdlet reference and profiles for Windows, macOS and Linux administrators."
  type: "reference"
  access: "free"
  organization: "Microsoft"
