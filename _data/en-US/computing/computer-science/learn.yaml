- name: "Introduction to Algorithms (CLRS)"
  url: "https://mitpress.mit.edu/algorithms/"
  description: "The definitive textbook on computer algorithms by Cormen, Leiserson, Rivest, and Stein covering data structures and complexity."
  type: "textbook"
  access: "paid"
  organization: "The MIT Press"

- name: "Computer Systems: A Programmer's Perspective (CS:APP)"
  url: "https://csapp.cs.cmu.edu/"
  description: "A foundational textbook by Bryant and O'Hallaron explaining how computer architecture, OS, and compilers work together."
  type: "textbook"
  access: "freemium"
  organization: "Carnegie Mellon University"

- name: "Teach Yourself Computer Science"
  url: "https://teachyourselfcs.com/"
  description: "A structured study guide outlining essential computer science subjects, recommended textbooks, and video lectures."
  type: "course"
  access: "free"
  organization: "Bradfield School of Computer Science"

- name: "Operating Systems: Three Easy Pieces (OSTEP)"
  url: "https://pages.cs.wisc.edu/~remzi/OSTEP/"
  description: "A free online textbook by Remzi Arpaci-Dusseau and Andrea Arpaci-Dusseau covering virtualization, concurrency, and persistence."
  type: "textbook"
  access: "free"
  organization: "University of Wisconsin-Madison"

- name: "Computer Science Roadmap (roadmap.sh)"
  url: "https://roadmap.sh/computer-science"
  description: "Interactive roadmap on a self-taught computer science curriculum: topics laid out in a suggested study order, each linking to further reading."
  type: "reference"
  access: "free"
  organization: "roadmap.sh"

- name: "Data Structures and Algorithms Roadmap (roadmap.sh)"
  url: "https://roadmap.sh/datastructures-and-algorithms"
  description: "Interactive roadmap on data structures and algorithms: topics laid out in a suggested study order, each linking to further reading."
  type: "reference"
  access: "free"
  organization: "roadmap.sh"

- name: "LeetCode Roadmap (roadmap.sh)"
  url: "https://roadmap.sh/leetcode"
  description: "Interactive roadmap on coding interview practice: topics laid out in a suggested study order, each linking to further reading."
  type: "reference"
  access: "free"
  organization: "roadmap.sh"
