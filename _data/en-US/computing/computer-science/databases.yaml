- name: "ACM Digital Library"
  url: "https://dl.acm.org/"
  description: "A comprehensive database and bibliographic index of computing literature covering journals, conference proceedings, and books."
  type: "database"
  access: "freemium"
  organization: "Association for Computing Machinery"

- name: "IEEE Xplore Digital Library"
  url: "https://ieeexplore.ieee.org/"
  description: "A research database providing access to millions of peer-reviewed articles and standards in computer science and electrical engineering."
  type: "database"
  access: "freemium"
  organization: "IEEE"

- name: "arXiv Computer Science Repository"
  url: "https://arxiv.org/archive/cs"
  description: "An open-access archive and repository of scholarly preprints covering all foundational and applied computer science disciplines."
  type: "database"
  access: "free"
  organization: "Cornell University"

- name: "Internet Archive - Computer History Collections"
  url: "https://archive.org/details/texts"
  description: "A digital library preserving historical computing textbooks, hardware documentation, system manuals, and computing artifacts."
  type: "database"
  access: "free"
  organization: "Internet Archive"
