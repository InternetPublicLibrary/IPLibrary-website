- name: "ImageNet"
  url: "https://image-net.org/"
  description: "A large-scale visual database organized according to the WordNet hierarchy used for benchmarking computer vision models."
  type: "database"
  access: "free"
  organization: "Stanford Vision Lab"

- name: "CVF Open Access"
  url: "https://openaccess.thecvf.com/"
  description: "An open-access repository containing peer-reviewed papers and conference proceedings from CVPR, ICCV, and WACV."
  type: "database"
  access: "free"
  organization: "Computer Vision Foundation"

- name: "Kaggle Datasets"
  url: "https://www.kaggle.com/datasets"
  description: "A data platform hosting tens of thousands of annotated image, video, and computer vision datasets."
  type: "database"
  access: "free"
  organization: "Kaggle"

- name: "Hugging Face Datasets"
  url: "https://huggingface.co/datasets"
  description: "A community hub featuring vision benchmarks, multimodal training sets, and object detection data collections."
  type: "database"
  access: "free"
  organization: "Hugging Face"
