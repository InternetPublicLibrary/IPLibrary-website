- name: "IEEE/ACM Transactions on Networking"
  url: "https://www.computer.org/csdl/trans/nt"
  description: "A premier bimonthly peer-reviewed journal publishing research on the theory, algorithms, and architectures of computer networks."
  type: "journal"
  access: "paid"
  organization: "IEEE and ACM"

- name: "IEEE Communications Surveys & Tutorials"
  url: "https://www.comsoc.org/publications/journals/ieee-comst"
  description: "An archival online journal publishing comprehensive peer-reviewed tutorials and surveys covering all aspects of communications networks."
  type: "journal"
  access: "paid"
  organization: "IEEE Communications Society"

- name: "RFC 7208: Sender Policy Framework (SPF)"
  url: "https://datatracker.ietf.org/doc/html/rfc7208"
  description: "IETF standard defining the Sender Policy Framework, which lets domain owners publish which mail servers may send email on their behalf."
  type: "reference"
  access: "free"
  organization: "Internet Engineering Task Force"

- name: "RFC 6376: DomainKeys Identified Mail (DKIM) Signatures"
  url: "https://datatracker.ietf.org/doc/html/rfc6376"
  description: "IETF standard specifying DKIM, a method for signing email messages cryptographically so receivers can verify the sending domain and detect tampering."
  type: "reference"
  access: "free"
  organization: "Internet Engineering Task Force"
