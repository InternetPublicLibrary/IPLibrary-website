- name: "Computer Networking: A Top-Down Approach (Online Resources)"
  url: "https://gaia.cs.umass.edu/kurose_ross/"
  description: "Companion interactive problems, Wireshark lab assignments, and lecture slides for the Kurose and Ross networking textbook."
  type: "textbook"
  access: "free"
  organization: "University of Massachusetts Amherst"

- name: "Stanford CS144: Introduction to Computer Networking"
  url: "https://cs144.github.io/"
  description: "Course materials and hands-on lab assignments guiding students to build their own TCP implementation from scratch."
  type: "course"
  access: "free"
  organization: "Stanford University"

- name: "Wireshark University"
  url: "https://www.wireshark.org/docs/"
  description: "Official user guides, protocol reference documentation, and practical packet analysis instructional material."
  type: "tutorial"
  access: "free"
  organization: "Wireshark Foundation"

- name: "Linux Advanced Routing & Traffic Control"
  url: "https://lartc.org"
  description: "Long-standing HOWTO and manual collection on advanced Linux networking, including policy routing, traffic shaping and the tc queueing tools, for network administrators."
  type: "reference"
  access: "free"
  organization: "LARTC"

- name: "SSH Tunneling Guide"
  url: "https://www.ssh.com/academy/ssh/tunneling-example"
  description: "Tutorial on SSH port forwarding that shows local, remote and dynamic tunnel commands and the matching server configuration for system administrators."
  type: "tutorial"
  access: "free"
  organization: "SSH Communications Security"

- name: "DNS Record Types Explained"
  url: "https://www.nslookup.io/learning/dns-record-types/"
  description: "Reference guide describing each DNS record type, such as A, MX, TXT and CNAME, with links to detailed explanations for network and system administrators."
  type: "reference"
  access: "free"
  organization: "NsLookup.io"
