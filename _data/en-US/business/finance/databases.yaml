- name: "FRED Economic Data"
  url: "https://fred.stlouisfed.org/"
  description: "Extensive economic database maintaining hundreds of thousands of U.S. and international macro indicators, rates, and monetary series."
  type: "database"
  access: "free"
  organization: "Federal Reserve Bank of St. Louis"

- name: "Damodaran Online Corporate Finance Data"
  url: "https://pages.stern.nyu.edu/~adamodar/"
  description: "Comprehensive corporate valuation repository offering updated industry multiples, cost of capital benchmarks, and risk premiums."
  type: "database"
  access: "free"
  organization: "NYU Stern School of Business"

- name: "Kenneth R. French Data Library"
  url: "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html"
  description: "Academic data library containing historical factor returns, Fama-French benchmarks, and industry portfolio datasets."
  type: "database"
  access: "free"
  organization: "Tuck School of Business at Dartmouth"

- name: "Bank for International Settlements Statistics"
  url: "https://www.bis.org/statistics/index.htm"
  description: "Global financial database providing statistics on international banking, foreign exchange markets, and debt securities."
  type: "database"
  access: "free"
  organization: "Bank for International Settlements"
