- name: "FHFA House Price Index (HPI)"
  url: "https://www.fhfa.gov/hpi"
  description: "Comprehensive federal measure of single-family house price movements across U.S. metropolitan areas, states, and census divisions."
  type: "database"
  access: "free"
  organization: "Federal Housing Finance Agency"

- name: "HUD User Data Sets"
  url: "https://www.huduser.gov/"
  description: "Federal housing policy research database offering fair market rents, median family income limits, and housing market analyses."
  type: "database"
  access: "free"
  organization: "U.S. Department of Housing and Urban Development"

- name: "Zillow Research Data"
  url: "https://www.zillow.com/research/data/"
  description: "Free downloadable datasets on local and national home value indices, monthly rental values, inventory metrics, and buyer forecasts."
  type: "database"
  access: "free"
  organization: "Zillow Group"

- name: "NAR Research and Statistics"
  url: "https://www.nar.realtor/research-and-statistics"
  description: "Industry statistics portal providing existing-home sales data, commercial market reports, and housing affordability index numbers."
  type: "database"
  access: "free"
  organization: "National Association of Realtors"
