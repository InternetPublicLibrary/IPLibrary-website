- name: "North American Industry Classification System (NAICS)"
  url: "https://www.census.gov/naics"
  description: "Official federal classification standard used by statistical agencies in classifying business establishments for analyzing industry economics."
  type: "database"
  access: "free"
  organization: "U.S. Census Bureau"

- name: "Annual Survey of Manufactures (ASM)"
  url: "https://www.census.gov/programs-surveys/asm.html"
  description: "Comprehensive federal benchmark providing statistics on manufacturing employment, payroll, operating costs, and value of shipments."
  type: "database"
  access: "free"
  organization: "U.S. Census Bureau"

- name: "UNIDO Industrial Statistics Database (INDSTAT)"
  url: "https://stat.unido.org/"
  description: "United Nations industrial statistics database containing historical production figures, value added, and employment data across global sectors."
  type: "database"
  access: "free"
  organization: "United Nations Industrial Development Organization"
