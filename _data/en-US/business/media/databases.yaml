- name: "Pew Research Center Journalism & Media Datasets"
  url: "https://www.pewresearch.org/datasets/"
  description: "Repository of public opinion datasets and content analysis tracking news consumption habits, newsroom economics, and digital media trends."
  type: "database"
  access: "free"
  organization: "Pew Research Center"

- name: "Reuters Institute Digital News Report Data"
  url: "https://reutersinstitute.politics.ox.ac.uk/digital-news-report"
  description: "Annual international survey tracking news consumption patterns, publisher trust, and media business models across global markets."
  type: "database"
  access: "free"
  organization: "Reuters Institute for the Study of Journalism"

- name: "FCC Media Bureau Databases"
  url: "https://www.fcc.gov/media"
  description: "Federal regulatory database tracking broadcast licensing, television station ownership records, and cable industry filings."
  type: "database"
  access: "free"
  organization: "Federal Communications Commission"
