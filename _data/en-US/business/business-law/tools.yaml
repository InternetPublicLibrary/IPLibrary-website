- name: "Cornell Legal Information Institute (LII)"
  url: "https://www.law.cornell.edu/"
  description: "Free, open-access legal research platform providing the full text of U.S. federal laws, regulations, and Supreme Court opinions."
  type: "tool"
  access: "free"
  organization: "Cornell Law School"

- name: "Justia"
  url: "https://www.justia.com/"
  description: "Online legal portal providing free access to federal and state case law, statutes, regulations, and legal forms."
  type: "tool"
  access: "free"
  organization: "Justia"

- name: "CourtListener"
  url: "https://www.courtlistener.com/"
  description: "Free legal research website providing millions of legal opinions, court dockets, oral argument audio, and judicial data."
  type: "tool"
  access: "free"
  organization: "Free Law Project"

- name: "Oyez"
  url: "https://www.oyez.org/"
  description: "Multimedia archive offering audio recordings, transcripts, and summaries of all major U.S. Supreme Court proceedings."
  type: "tool"
  access: "free"
  organization: "Legal Information Institute"
