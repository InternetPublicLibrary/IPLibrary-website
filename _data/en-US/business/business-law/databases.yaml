- name: "SEC EDGAR Database"
  url: "https://www.sec.gov/edgar/searchedgar/companysearch"
  description: "Free public database providing access to corporate disclosures, annual reports (10-K), and regulatory filings for U.S. public companies."
  type: "database"
  access: "free"
  organization: "U.S. Securities and Exchange Commission"

- name: "Uniform Commercial Code Locator"
  url: "https://www.law.cornell.edu/ucc"
  description: "Open-access database and locator for the Uniform Commercial Code (UCC) articles governing commercial transactions across U.S. jurisdictions."
  type: "database"
  access: "free"
  organization: "Legal Information Institute"

- name: "USPTO Trademark Search"
  url: "https://www.uspto.gov/trademarks/search"
  description: "Official federal registry database for searching registered trademarks, pending applications, and intellectual property ownership records."
  type: "database"
  access: "free"
  organization: "United States Patent and Trademark Office"

- name: "Electronic Code of Federal Regulations (eCFR)"
  url: "https://www.ecfr.gov/"
  description: "Regularly updated online database of the Code of Federal Regulations containing U.S. federal administrative rules and commercial regulations."
  type: "database"
  access: "free"
  organization: "National Archives and Records Administration"
