- name: "Bureau of Labor Statistics (BLS)"
  url: "https://www.bls.gov/"
  description: "Federal statistical agency providing comprehensive labor economics data, employment projections, wages, and workplace injury statistics."
  type: "database"
  access: "free"
  organization: "U.S. Department of Labor"

- name: "O*NET OnLine"
  url: "https://www.onetonline.org/"
  description: "Comprehensive occupational database containing detailed descriptions of worker characteristics, required skills, and job responsibilities."
  type: "database"
  access: "free"
  organization: "U.S. Department of Labor"

- name: "EEOC Statistics and Data"
  url: "https://www.eeoc.gov/data"
  description: "Official federal repository of workplace discrimination charges, enforcement statistics, and employer information reports (EEO-1)."
  type: "database"
  access: "free"
  organization: "Equal Employment Opportunity Commission"
