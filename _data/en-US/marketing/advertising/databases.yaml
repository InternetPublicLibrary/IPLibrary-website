- name: "Google Ads Transparency Center"
  url: "https://adstransparency.google.com/"
  description: "Searchable repository of all advertisements served through Google Ads, detailing advertiser identity and creative variations."
  type: "database"
  access: "free"
  organization: "Google"

- name: "Meta Ad Library"
  url: "https://www.facebook.com/ads/library/"
  description: "Publicly accessible archive of all active advertisements running across Meta technologies, including historical social issue and political ads."
  type: "database"
  access: "free"
  organization: "Meta"

- name: "WARC"
  url: "https://www.warc.com/"
  description: "Comprehensive global database and benchmark service for advertising case studies, effectiveness research, and media investment data."
  type: "database"
  access: "paid"
  organization: "Ascential"
