- name: "USPTO Trademark Search"
  url: "https://tmsearch.uspto.gov/"
  description: "Official United States federal database for searching registered trademarks, service marks, and pending brand applications."
  type: "database"
  access: "free"
  organization: "United States Patent and Trademark Office"
- name: "ICANN Registration Data Lookup"
  url: "https://lookup.icann.org/"
  description: "Official domain registry database providing registration records and domain availability across top-level domains."
  type: "database"
  access: "free"
  organization: "ICANN"
- name: "WIPO Global Brand Database"
  url: "https://branddb.wipo.int/"
  description: "Worldwide intellectual property database to perform global searches for trademarks and registered brand assets."
  type: "database"
  access: "free"
  organization: "World Intellectual Property Organization"
