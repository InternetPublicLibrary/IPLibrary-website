- name: "Association of Religion Data Archives"
  url: "https://www.thearda.com/"
  description: "Free data archive providing quantitative datasets, national surveys, and demographic statistics on religion across the United States and internationally."
  type: "database"
  access: "free"
  organization: "Association of Religion Data Archives"
- name: "Database of Religious History"
  url: "https://religiondatabase.org/"
  description: "Quantitative and qualitative scholarly database documenting historical religious practices, beliefs, and traditions across world history."
  type: "database"
  access: "free"
  organization: "University of British Columbia"
- name: "Open Access Digital Theological Library"
  url: "https://oadtl.org/"
  description: "Curated digital library providing open-access theological books, religious studies journals, primary sources, and reference materials."
  type: "database"
  access: "free"
  organization: "Digital Theological Library"
- name: "Pew Research Center - Religion & Public Life"
  url: "https://www.pewresearch.org/religion/"
  description: "Demographic and public opinion database tracking global religious affiliations, spirituality trends, and social attitudes."
  type: "database"
  access: "free"
  organization: "Pew Research Center"
- name: "Internet Sacred Text Archive"
  url: "https://www.sacred-texts.com/"
  description: "Freely accessible public archive of historical texts and primary sources on world religions, mythology, mysticism, and spiritual traditions."
  type: "database"
  access: "free"
  organization: "Internet Sacred Text Archive"
