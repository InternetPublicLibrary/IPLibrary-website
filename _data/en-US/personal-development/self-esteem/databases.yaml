- name: "OpenPsychometrics Raw Data Archives"
  url: "https://openpsychometrics.org/_rawdata/"
  description: "Open-access data repository hosting anonymous raw response datasets from thousands of participants completing the Rosenberg Self-Esteem Scale and personality inventories."
  type: "database"
  access: "free"
  organization: "OpenPsychometrics"
- name: "MIDUS Study Data Portal"
  url: "https://midus.wisc.edu/"
  description: "National longitudinal data archive tracking psychological well-being, self-acceptance, personal growth, and self-esteem across adult lifespans."
  type: "database"
  access: "free"
  organization: "University of Wisconsin-Madison"
- name: "World Values Survey"
  url: "https://www.worldvaluessurvey.org/"
  description: "Global cross-national database compiling longitudinal survey data on subjective well-being, perceived agency, and personal life satisfaction."
  type: "database"
  access: "free"
  organization: "World Values Survey Association"
- name: "Open Science Framework"
  url: "https://osf.io/"
  description: "Open science registry and repository hosting public empirical research datasets, pre-registrations, and replication files on self-esteem and self-compassion."
  type: "database"
  access: "free"
  organization: "Center for Open Science"
