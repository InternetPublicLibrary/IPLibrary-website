- name: "Consumer Financial Protection Bureau Data"
  url: "https://www.consumerfinance.gov/data-research/"
  description: "Federal research database and consumer complaints registry tracking consumer credit trends, mortgage terms, and financial products."
  type: "database"
  access: "free"
  organization: "Consumer Financial Protection Bureau"
- name: "Federal Reserve Economic Data (FRED)"
  url: "https://fred.stlouisfed.org/"
  description: "Comprehensive macroeconomic and consumer finance database tracking interest rates, inflation metrics, and household debt."
  type: "database"
  access: "free"
  organization: "Federal Reserve Bank of St. Louis"
- name: "SEC EDGAR"
  url: "https://www.sec.gov/edgar/searchedgar/companysearch"
  description: "Official United States government database containing company disclosures, mutual fund prospectuses, and financial filings."
  type: "database"
  access: "free"
  organization: "U.S. Securities and Exchange Commission"
