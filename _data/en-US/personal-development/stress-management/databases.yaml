- name: "APA Stress in America"
  url: "https://www.apa.org/news/press/releases/stress"
  description: "Annual nationwide empirical survey database documenting stress levels, primary stressors, and coping behaviors across American demographics."
  type: "database"
  access: "free"
  organization: "American Psychological Association"
- name: "NIMH Mental Health Statistics"
  url: "https://www.nimh.nih.gov/health/statistics"
  description: "Epidemiological data portal providing national statistics and prevalence estimates for anxiety disorders, chronic stress, and mental illness."
  type: "database"
  access: "free"
  organization: "National Institute of Mental Health"
- name: "NCCIH Research Portal"
  url: "https://www.nccih.nih.gov/"
  description: "Federal scientific database cataloging clinical research, trials, and systematic reviews on mind-body practices, meditation, and stress reduction."
  type: "database"
  access: "free"
  organization: "National Center for Complementary and Integrative Health"
- name: "NIOSH Workplace Safety and Health"
  url: "https://www.cdc.gov/niosh/"
  description: "Federal research database tracking occupational hazards, workplace stress factors, job burnout, and psychological safety guidelines."
  type: "database"
  access: "free"
  organization: "National Institute for Occupational Safety and Health"
- name: "WHO Global Health Observatory"
  url: "https://www.who.int/data/gho"
  description: "International health repository aggregating global data on mental health, occupational stress, and noncommunicable health burdens."
  type: "database"
  access: "free"
  organization: "World Health Organization"
