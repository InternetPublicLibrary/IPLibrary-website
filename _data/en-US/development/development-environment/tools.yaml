- name: "Visual Studio Code"
  url: "https://code.visualstudio.com"
  description: "Extensible source-code editor developed by Microsoft supporting debugging, task running, and version control."
  type: "tool"
  access: "free"
  organization: "Microsoft"

- name: "Docker"
  url: "https://www.docker.com"
  description: "Containerization platform enabling developers to package applications and dependencies into standardized development environments."
  type: "tool"
  access: "freemium"
  organization: "Docker, Inc."

- name: "Neovim"
  url: "https://neovim.io"
  description: "Hyperextensible Vim-based text editor built for high configurability, modern Lua scripting, and language server protocol integration."
  type: "tool"
  access: "free"
  organization: "Neovim"

- name: "JetBrains Toolbox & IDEs"
  url: "https://www.jetbrains.com"
  description: "Suite of specialized integrated development environments including IntelliJ IDEA, PyCharm, and WebStorm for multi-language development."
  type: "tool"
  access: "freemium"
  organization: "JetBrains"

- name: "NVIDIA Container Toolkit"
  url: "https://github.com/NVIDIA/nvidia-container-toolkit"
  description: "Libraries and utilities that let Docker and other container runtimes access NVIDIA GPUs, used for running machine learning and compute workloads in containers."
  type: "tool"
  access: "free"
  organization: "NVIDIA"

- name: "Quay.io"
  url: "https://quay.io"
  description: "Hosted container registry for building, storing and distributing container images, with free public repositories and security scanning of stored images."
  type: "tool"
  access: "freemium"
  organization: "Red Hat"

- name: "Distribution"
  url: "https://github.com/distribution/distribution"
  description: "Open source implementation of a container registry server and toolkit for storing and serving OCI and Docker images, used as the basis of many registries."
  type: "tool"
  access: "free"
  organization: "CNCF"

- name: "docker-gen"
  url: "https://github.com/nginx-proxy/docker-gen"
  description: "Open source utility that renders configuration files from templates using Docker container metadata, commonly used to drive reverse proxies such as nginx."
  type: "tool"
  access: "free"
  organization: "nginx-proxy"

- name: "runc"
  url: "https://github.com/opencontainers/runc"
  description: "Command-line tool that spawns and runs containers according to the OCI runtime specification, serving as the low-level runtime beneath Docker and other platforms."
  type: "tool"
  access: "free"
  organization: "Open Container Initiative"

- name: "Podman"
  url: "https://docs.podman.io/en/latest/"
  description: "Daemonless open source container engine for building, running and managing OCI containers and pods, offering a Docker-compatible command line."
  type: "tool"
  access: "free"
  organization: "Podman"
