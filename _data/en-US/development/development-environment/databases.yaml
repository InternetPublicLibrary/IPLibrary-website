- name: "Docker Hub"
  url: "https://hub.docker.com"
  description: "World's largest repository and registry database of container images for development environments and application runtimes."
  type: "database"
  access: "freemium"
  organization: "Docker, Inc."

- name: "Nixpkgs Package Database"
  url: "https://search.nixos.org/packages"
  description: "Searchable database and package collection for the reproducible Nix package manager containing over 100,000 software packages."
  type: "database"
  access: "free"
  organization: "NixOS Foundation"

- name: "VS Code Marketplace"
  url: "https://marketplace.visualstudio.com/vscode"
  description: "Official public registry and database of editor extensions, snippets, and environment integrations for Visual Studio Code."
  type: "database"
  access: "free"
  organization: "Microsoft"

- name: "Artifact Hub"
  url: "https://artifacthub.io"
  description: "Open-source repository database for finding, installing, and publishing cloud-native packages, container tools, and Helm charts."
  type: "database"
  access: "free"
  organization: "Cloud Native Computing Foundation"
