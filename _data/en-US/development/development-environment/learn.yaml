- name: "The Missing Semester of Your CS Education"
  url: "https://missing.csail.mit.edu/"
  description: "Free practical computer science course by MIT teaching shell tools, editors, version control, and computing environment mastery."
  type: "course"
  access: "free"
  organization: "Massachusetts Institute of Technology"

- name: "Development Container Specification"
  url: "https://containers.dev"
  description: "Open specification defining how to configure and enrich containerized developer environments across varied tools and platforms."
  type: "reference"
  access: "free"
  organization: "Development Container Specification Working Group"

- name: "Nix Learning Guides"
  url: "https://nix.dev"
  description: "Official tutorials and beginner-friendly guides for configuring reproducible development environments and shells with Nix."
  type: "course"
  access: "free"
  organization: "NixOS Foundation"

- name: "Terraform Best Practices on Google Cloud"
  url: "https://docs.cloud.google.com/docs/terraform/best-practices/general-style-structure"
  description: "Google Cloud guide to structuring and styling Terraform configurations, covering module layout, naming and conventions for teams managing infrastructure as code."
  type: "reference"
  access: "free"
  organization: "Google Cloud"

- name: "Docker Internals"
  url: "https://docker-saigon.github.io/post/Docker-Internals/"
  description: "Long-form technical explainer of how Docker builds on Linux kernel features such as namespaces, cgroups, layered storage and networking, for engineers who want to understand containers in depth."
  type: "reference"
  access: "free"
  organization: "Docker Saigon"

- name: "Docker Docs"
  url: "https://docs.docker.com/"
  description: "Official Docker documentation with manuals, guides and references for building, running and networking containers with Docker Engine, Compose and related tools."
  type: "reference"
  access: "free"
  organization: "Docker"

- name: "Rubber Docker"
  url: "https://github.com/Fewbytes/rubber-docker"
  description: "Hands-on workshop that guides participants through rebuilding a minimal Docker-like container runtime in Python to learn the Linux primitives behind containers."
  type: "tutorial"
  access: "free"
  organization: "Fewbytes"

- name: "QEMU Documentation"
  url: "https://www.qemu.org/docs/master/"
  description: "Official documentation for QEMU, the open-source machine emulator and virtualiser, covering system emulation, invocation options and device configuration."
  type: "reference"
  access: "free"
  organization: "QEMU"
