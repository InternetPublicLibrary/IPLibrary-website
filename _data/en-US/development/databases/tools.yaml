- name: "DBeaver"
  url: "https://dbeaver.io"
  description: "Free multi-platform universal database tool for developers, database administrators, and analysts supporting SQL and NoSQL databases."
  type: "tool"
  access: "free"
  organization: "DBeaver Corporation"

- name: "pgAdmin"
  url: "https://www.pgadmin.org"
  description: "Open-source administration and development platform designed specifically for PostgreSQL database management."
  type: "tool"
  access: "free"
  organization: "PostgreSQL Community"

- name: "Liquibase"
  url: "https://www.liquibase.com"
  description: "Open-source database schema change management tool that automates database migrations within CI/CD pipelines."
  type: "tool"
  access: "freemium"
  organization: "Liquibase"

- name: "Flyway"
  url: "https://flywaydb.org"
  description: "Open-source database migration tool strongly favoring simplicity and convention over configuration in version control."
  type: "tool"
  access: "freemium"
  organization: "Redgate Software"

- name: "Bytebase"
  url: "https://www.bytebase.com"
  description: "Database CI/CD and schema migration tool designed for DevOps teams and developers managing database changes via GitOps."
  type: "tool"
  access: "freemium"
  organization: "Bytebase"
