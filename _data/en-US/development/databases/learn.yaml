- name: "Use The Index, Luke!"
  url: "https://use-the-index-luke.com"
  description: "Comprehensive guide to SQL database indexing and performance optimization across major relational databases."
  type: "textbook"
  access: "free"
  organization: "Markus Winand"

- name: "Database Internals"
  url: "https://databass.dev"
  description: "Reference companion and guide exploring storage engines, B-trees, LSM trees, and distributed data systems architecture."
  type: "textbook"
  access: "paid"
  organization: "Alex Petrov"

- name: "Designing Data-Intensive Applications"
  url: "https://dataintensive.net"
  description: "Key reference textbook explaining data models, storage internals, transaction processing, and consensus algorithms."
  type: "textbook"
  access: "paid"
  organization: "Martin Kleppmann"

- name: "PostgreSQL Privileges Documentation"
  url: "https://www.postgresql.org/docs/current/ddl-priv.html"
  description: "Section of the official PostgreSQL manual explaining object ownership, the GRANT and REVOKE commands and the available privilege types for database administrators."
  type: "reference"
  access: "free"
  organization: "PostgreSQL Global Development Group"

- name: "MongoDB Manual"
  url: "https://www.mongodb.com/docs/manual/"
  description: "Official documentation for the MongoDB document database, covering installation, data modelling, queries, indexing, replication and sharding for developers and administrators."
  type: "reference"
  access: "free"
  organization: "MongoDB"
