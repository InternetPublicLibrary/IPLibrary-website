- name: "IANA Time Zone Database"
  url: "https://www.iana.org/time-zones"
  description: "Foundational reference database representing the history of local time offsets for locations worldwide."
  type: "database"
  access: "free"
  organization: "Internet Assigned Numbers Authority"

- name: "Unicode Character Database"
  url: "https://www.unicode.org"
  description: "Authoritative database and standard specifications defining characters, encodings, and properties for all computing platforms."
  type: "database"
  access: "free"
  organization: "Unicode Consortium"

- name: "Public Suffix List"
  url: "https://publicsuffix.org/"
  description: "Cross-industry initiative cataloging domain suffixes under which internet users can directly register names."
  type: "database"
  access: "free"
  organization: "Mozilla Foundation & Volunteer Community"
