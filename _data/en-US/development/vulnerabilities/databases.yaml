- name: "National Vulnerability Database (NVD)"
  url: "https://nvd.nist.gov"
  description: "U.S. government repository of standards-based vulnerability management data mapped to Common Vulnerabilities and Exposures."
  type: "database"
  access: "free"
  organization: "National Institute of Standards and Technology"

- name: "CVE Program"
  url: "https://www.cve.org"
  description: "International dictionary and standard database identifying publicly disclosed cybersecurity vulnerabilities."
  type: "database"
  access: "free"
  organization: "The MITRE Corporation"

- name: "Common Weakness Enumeration (CWE)"
  url: "https://cwe.mitre.org"
  description: "Community-developed taxonomy database of software and hardware weaknesses and architectural security flaws."
  type: "database"
  access: "free"
  organization: "The MITRE Corporation"

- name: "Exploit Database"
  url: "https://www.exploit-db.com/"
  description: "Non-profit CVE-compliant database archiving public exploits and software vulnerability research papers."
  type: "database"
  access: "free"
  organization: "OffSec"
