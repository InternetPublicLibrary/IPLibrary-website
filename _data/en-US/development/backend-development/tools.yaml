  description: "Open-source, cross-platform JavaScript runtime environment executing JavaScript code outside a web browser."
  type: "tool"
  access: "free"
  organization: "OpenJS Foundation"

- name: "Django"
  url: "https://www.djangoproject.com"
  description: "High-level Python web framework that encourages rapid development and clean, pragmatic design."
  type: "tool"
  access: "free"
  organization: "Django Software Foundation"

- name: "Spring Framework"
  url: "https://spring.io"
  description: "Comprehensive programming and configuration model for modern Java-based enterprise backend applications."
  type: "tool"
  access: "free"
  organization: "Broadcom"

- name: "FastAPI"
  url: "https://fastapi.tiangolo.com"
  description: "Modern, high-performance web framework for building APIs with Python based on standard type hints."
  type: "tool"
  access: "free"
  organization: "FastAPI"

- name: "Postman"
  url: "https://www.postman.com"
  description: "API platform for building, testing, documenting, and collaborating on backend REST, GraphQL, and gRPC APIs."
  type: "tool"
  access: "freemium"
  organization: "Postman, Inc."

- name: "gRPC"
  url: "https://grpc.io/"
  description: "Open source remote procedure call framework that uses Protocol Buffers and HTTP/2 to connect services across languages, widely used in microservice architectures."
  type: "tool"
  access: "free"
  organization: "CNCF"

- name: "Haml"
  url: "https://haml.info/"
  description: "Templating language for Ruby applications that describes HTML through indentation, letting Rails and other Ruby developers write markup with less repetition."
  type: "tool"
  access: "free"
  organization: "Haml"

- name: "dotenv"
  url: "https://github.com/motdotla/dotenv"
  description: "Widely used Node.js module that loads environment variables from a .env file into process.env, keeping configuration separate from application code."
  type: "tool"
  access: "free"
  organization: "dotenv"

- name: "dotenv-expand"
  url: "https://github.com/dotenvx/dotenv-expand"
  description: "Companion module for dotenv that expands variable references inside .env files, allowing Node.js developers to compose configuration values from existing environment variables."
  type: "tool"
  access: "free"
  organization: "dotenvx"

- name: "node-config"
  url: "https://github.com/node-config/node-config"
  description: "Configuration library for Node.js that organises settings into hierarchical files per deployment environment, with support for overrides through environment variables."
  type: "tool"
  access: "free"
  organization: "node-config"
