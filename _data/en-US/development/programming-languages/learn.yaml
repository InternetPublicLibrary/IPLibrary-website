- name: "The Rust Programming Language Book"
  url: "https://www.rust-lang.org/"
  description: "Official introductory textbook for Rust, also known as 'The Book', covering ownership, borrowing, and concurrency."
  type: "textbook"
  access: "free"
  organization: "Rust Foundation"

- name: "Types and Programming Languages (TAPL)"
  url: "https://www.cis.upenn.edu/~bcpierce/tapl/"
  description: "Comprehensive textbook by Benjamin C. Pierce on type systems, operational semantics, and programming language theory."
  type: "textbook"
  access: "paid"
  organization: "University of Pennsylvania"

- name: "A Tour of Go"
  url: "https://go.dev"
  description: "Interactive tutorial introducing all the basic and advanced features of the Go programming language in the browser."
  type: "course"
  access: "free"
  organization: "Google"

- name: "TypeScript Handbook"
  url: "https://www.typescriptlang.org"
  description: "Comprehensive guide and reference documentation covering TypeScript syntax, types, and compiler configuration."
  type: "reference"
  access: "free"
  organization: "Microsoft"

- name: "Python Packaging User Guide"
  url: "https://packaging.python.org/en/latest/"
  description: "Official guide to installing, building and distributing Python packages, covering virtual environments, pip, project metadata and publishing to the package index."
  type: "reference"
  access: "free"
  organization: "Python Packaging Authority"

- name: "Python Documentation"
  url: "https://docs.python.org/3/"
  description: "Official documentation for the Python language, including the tutorial, language reference, standard library reference and platform-specific usage guides."
  type: "reference"
  access: "free"
  organization: "Python Software Foundation"

- name: "TypeScript Handbook"
  url: "https://www.typescriptlang.org/docs/handbook/"
  description: "Official handbook for the TypeScript language, explaining its type system and features from the basics through advanced topics for JavaScript developers."
  type: "reference"
  access: "free"
  organization: "Microsoft"

- name: "Ruby QuickRef"
  url: "https://zenspider.com/ruby/quickref.html"
  description: "Compact single-page reference to Ruby syntax, core classes, operators and standard idioms, useful for programmers who need a quick reminder while coding."
  type: "reference"
  access: "free"
  organization: "zenspider.com"
