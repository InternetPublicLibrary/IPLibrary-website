- name: "SWEBOK Guide (Body of Knowledge)"
  url: "https://www.computer.org/education/bodies-of-knowledge/software-engineering"
  description: "Official guide to the Software Engineering Body of Knowledge defining international standards and educational baselines."
  type: "textbook"
  access: "free"
  organization: "IEEE Computer Society"

- name: "Refactoring.Guru"
  url: "https://refactoring.guru"
  description: "Educational guide explaining Gang of Four design patterns, code smells, refactoring techniques, and SOLID principles."
  type: "course"
  access: "free"
  organization: "Refactoring.Guru"

- name: "Designing Data-Intensive Applications"
  url: "https://dataintensive.net"
  description: "Seminal engineering textbook by Martin Kleppmann exploring reliability, scalability, maintainability, and data systems."
  type: "textbook"
  access: "paid"
  organization: "Martin Kleppmann"

- name: "Integration Database"
  url: "https://martinfowler.com/bliki/IntegrationDatabase.html"
  description: "Short reference essay explaining the integration database pattern, where several applications share one database, and the coupling problems it creates for software architects."
  type: "reference"
  access: "free"
  organization: "martinfowler.com"

- name: "The Twelve-Factor App"
  url: "https://12factor.net/"
  description: "Methodology describing twelve principles for building portable, scalable software-as-a-service applications, covering configuration, dependencies, processes, logs and deployment practices."
  type: "reference"
  access: "free"
  organization: "The Twelve-Factor App"

- name: "Folder Structure Conventions"
  url: "https://github.com/kriasoft/Folder-Structure-Conventions"
  description: "Reference describing common directory layouts and naming conventions for software projects, helping developers organise source, tests, documentation and build files consistently."
  type: "reference"
  access: "free"
  organization: "Kriasoft"
