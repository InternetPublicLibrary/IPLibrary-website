- name: "Defects4J"
  url: "https://github.com/rjust/defects4j"
  description: "Database of real software bugs and faults from open-source Java projects used to evaluate software testing and repair research."
  type: "database"
  access: "free"
  organization: "University of Washington & University of Massachusetts"

- name: "SWE-bench"
  url: "https://swebench.com"
  description: "Benchmark database and evaluation dataset composed of real GitHub pull requests, issues, and unit test suites."
  type: "database"
  access: "free"
  organization: "Princeton NLP"

- name: "National Vulnerability Database (NVD)"
  url: "https://nvd.nist.gov"
  description: "U.S. government repository of standards-based vulnerability management data used in automated security and regression test suites."
  type: "database"
  access: "free"
  organization: "National Institute of Standards and Technology"
