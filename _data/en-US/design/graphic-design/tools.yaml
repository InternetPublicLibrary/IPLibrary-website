- name: "Inkscape"
  url: "https://inkscape.org"
  description: "Free and open-source vector graphics editor used for illustration, icons, typography, and logo design."
  type: "tool"
  access: "free"
  organization: "Inkscape Project"

- name: "GIMP"
  url: "https://www.gimp.org"
  description: "Cross-platform open-source raster image editor providing tools for photo retouching, image composition, and graphic authoring."
  type: "tool"
  access: "free"
  organization: "GNOME Foundation"

- name: "Scribus"
  url: "https://www.scribus.net"
  description: "Open-source desktop publishing application supporting professional page layout, color separations, and PDF creation."
  type: "tool"
  access: "free"
  organization: "Scribus Development Team"

- name: "FontForge"
  url: "https://fontforge.org"
  description: "Free and open-source font editor for creating, editing, and converting outline and bitmap typography formats."
  type: "tool"
  access: "free"
  organization: "FontForge Contributors"

- name: "FontForge"
  url: "https://fontforge.org/en-US/"
  description: "Open-source outline font editor for creating and modifying typefaces in formats such as TrueType, OpenType and PostScript, used by type designers and hobbyists."
  type: "tool"
  access: "free"
  organization: "FontForge"

- name: "Fontpair"
  url: "https://fontpair.co/"
  description: "Catalogue of curated Google Fonts combinations that designers can browse and preview with their own text to pick matching heading and body typefaces."
  type: "tool"
  access: "free"
  organization: "Fontpair"

- name: "Adobe Fonts"
  url: "https://fonts.adobe.com/"
  description: "Subscription font library from Adobe offering thousands of licensed typefaces for desktop and web use, available to Creative Cloud members and some free accounts."
  type: "tool"
  access: "freemium"
  organization: "Adobe"

- name: "Font Squirrel"
  url: "https://www.fontsquirrel.com/"
  description: "Directory of free fonts licensed for commercial use, with character previews, licence details and a webfont generator for designers and web developers."
  type: "tool"
  access: "free"
  organization: "Font Squirrel"

- name: "MyFonts"
  url: "https://www.myfonts.com/"
  description: "Large online font store run by Monotype where designers can search, preview and license desktop and web fonts from many independent and established foundries."
  type: "tool"
  access: "paid"
  organization: "Monotype"
