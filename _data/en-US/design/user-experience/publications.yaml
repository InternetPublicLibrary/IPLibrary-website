- name: "The Encyclopedia of Human-Computer Interaction"
  url: "https://www.interaction-design.org/literature/book/the-encyclopedia-of-human-computer-interaction-2nd-ed"
  description: "Peer-reviewed, open-access textbook and reference work covering key concepts, historical foundations, and methodologies in HCI and UX design."
  type: "textbook"
  access: "free"
  organization: "Interaction Design Foundation"

- name: "Journal of User Experience"
  url: "https://uxpajournal.org"
  description: "Peer-reviewed open-access scholarly journal publishing empirical studies, methodologies, and case analyses in user experience."
  type: "journal"
  access: "free"
  organization: "User Experience Professionals Association"

- name: "ACM Transactions on Computer-Human Interaction"
  url: "https://dl.acm.org/journal/tochi"
  description: "Leading peer-reviewed academic journal covering theoretical and applied research in interactive systems and human-computer interaction."
  type: "journal"
  access: "paid"
  organization: "ACM"

- name: "The Design of Everyday Things"
  url: "https://jnd.org/books/"
  description: "Foundational book by Don Norman introducing affordances, signifiers, mental models, and human-centered design principles."
  type: "textbook"
  access: "paid"
  organization: "Don Norman"

- name: "Don't Make Me Think, Revisited"
  url: "https://sensible.com/dont-make-me-think/"
  description: "Influential guide by Steve Krug outlining core tenets of intuitive navigation, visual hierarchy, and usability testing."
  type: "textbook"
  access: "paid"
  organization: "Steve Krug"
