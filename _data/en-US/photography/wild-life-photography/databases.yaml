- name: "Macaulay Library"
  url: "https://www.macaulaylibrary.org/"
  description: "World's largest scientific archive of animal media containing photographs, audio recordings, and videos of global wildlife."
  type: "database"
  access: "free"
  organization: "Cornell Lab of Ornithology"

- name: "iNaturalist"
  url: "https://www.inaturalist.org/"
  description: "Global community biodiversity database mapping georeferenced observations and photographic records of organisms in the wild."
  type: "database"
  access: "free"
  organization: "California Academy of Sciences & National Geographic Society"

- name: "eBird Species Photo Archive"
  url: "https://ebird.org/"
  description: "Worldwide database tracking avian distribution, seasonality, and photographic records submitted by birders and wildlife photographers."
  type: "database"
  access: "free"
  organization: "Cornell Lab of Ornithology"
