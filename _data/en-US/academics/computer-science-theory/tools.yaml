- name: "Z3 Theorem Prover"
  url: "https://z3prover.github.io/api/html/index.html"
  description: "High-performance satisfiability modulo theories (SMT) solver developed by Microsoft Research for software verification and analysis."
  type: "tool"
  access: "free"
  organization: "Microsoft Research"

- name: "Coq Proof Assistant"
  url: "https://coq.inria.fr/"
  description: "Formal proof management system that provides a formal language to write mathematical definitions, algorithms, and theorems together with an environment for semi-interactive development of machine-checked proofs."
  type: "tool"
  access: "free"
  organization: "Inria"

- name: "Lean Prover"
  url: "https://lean-lang.org/"
  description: "Interactive theorem prover and pure functional programming language based on the calculus of constructions."
  type: "tool"
  access: "free"
  organization: "Lean Community"

- name: "JFLAP"
  url: "https://www.jflap.org/"
  description: "Educational software for experimenting with formal languages and automata theory, including finite state machines, pushdown automata, and Turing machines."
  type: "tool"
  access: "free"
  organization: "Duke University"

- name: "SPIN Model Checker"
  url: "https://spinroot.com/"
  description: "Popular open-source software verification tool for the formal verification of multi-threaded software and distributed algorithms."
  type: "tool"
  access: "free"
  organization: "Bell Labs"
