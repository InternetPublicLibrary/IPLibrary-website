- name: "arXiv"
  url: "https://arxiv.org/"
  description: "Curated open-access research repository containing millions of preprints in physics, astronomy, chemistry, and quantitative biology."
  type: "database"
  access: "free"
  organization: "Cornell University"

- name: "NASA Astrophysics Data System (ADS)"
  url: "https://ui.adsabs.harvard.edu/"
  description: "Digital library portal for researchers in astronomy and physics operated by the Smithsonian Astrophysical Observatory under a NASA grant."
  type: "database"
  access: "free"
  organization: "Smithsonian Astrophysical Observatory"

- name: "RCSB Protein Data Bank"
  url: "https://www.rcsb.org/"
  description: "Global repository of experimentally determined 3D structures of biological macromolecules including proteins and nucleic acids."
  type: "database"
  access: "free"
  organization: "RCSB PDB"

- name: "PubChem"
  url: "https://pubchem.ncbi.nlm.nih.gov/"
  description: "Open chemical database containing information on chemical structures, identifiers, properties, and biological activities."
  type: "database"
  access: "free"
  organization: "National Institutes of Health"

- name: "bioRxiv"
  url: "https://www.biorxiv.org/"
  description: "Free online archive and distribution service for unpublished preprints in the life sciences hosted by Cold Spring Harbor Laboratory."
  type: "database"
  access: "free"
  organization: "Cold Spring Harbor Laboratory"
