- name: "Federal Reserve Economic Data (FRED)"
  url: "https://fred.stlouisfed.org/"
  description: "Extensive online database of US and international economic time series maintained by the Federal Reserve Bank of St. Louis."
  type: "database"
  access: "free"
  organization: "Federal Reserve Bank of St. Louis"

- name: "World Bank Open Data"
  url: "https://data.worldbank.org/"
  description: "Free, open-access repository of global development indicators and socioeconomic statistics from the World Bank."
  type: "database"
  access: "free"
  organization: "World Bank"

- name: "ICPSR"
  url: "https://www.icpsr.umich.edu/"
  description: "World's largest archive of digital social science datasets, surveys, and polling studies maintained by the University of Michigan."
  type: "database"
  access: "free"
  organization: "University of Michigan"

- name: "IPUMS"
  url: "https://www.ipums.org/"
  description: "Harmonized census and survey data from around the world integrated for social and economic research."
  type: "database"
  access: "free"
  organization: "University of Minnesota"

- name: "Our World in Data"
  url: "https://ourworldindata.org/"
  description: "Open-access scientific online publication featuring research and interactive data on global poverty, health, and population."
  type: "database"
  access: "free"
  organization: "Global Change Data Lab"
