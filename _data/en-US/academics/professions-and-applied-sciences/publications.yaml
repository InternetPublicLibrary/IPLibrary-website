- name: "The New England Journal of Medicine (NEJM)"
  url: "https://www.nejm.org/"
  description: "Prestigious peer-reviewed medical journal publishing pioneering original research, clinical reviews, and perspective articles."
  type: "journal"
  access: "freemium"
  organization: "Massachusetts Medical Society"

- name: "The Lancet"
  url: "https://www.thelancet.com/"
  description: "World-leading independent general medical journal publishing high-impact global health clinical research."
  type: "journal"
  access: "freemium"
  organization: "Elsevier"

- name: "Harvard Law Review"
  url: "https://harvardlawreview.org/"
  description: "Student-run legal journal publishing scholarly articles, student notes, and commentaries on legal theory and judicial opinions."
  type: "journal"
  access: "free"
  organization: "Harvard Law School"

- name: "Annual Review of Public Health"
  url: "https://www.annualreviews.org/journal/publhealth"
  description: "Open-access scientific journal providing annual synthesis reviews of significant developments in epidemiology and healthcare systems."
  type: "journal"
  access: "free"
  organization: "Annual Reviews"
