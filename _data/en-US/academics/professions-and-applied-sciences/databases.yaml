- name: "PubMed"
  url: "https://pubmed.ncbi.nlm.nih.gov/"
  description: "Free biomedical and life sciences bibliographic database maintained by the National Library of Medicine at NIH."
  type: "database"
  access: "free"
  organization: "National Library of Medicine"

- name: "ClinicalTrials.gov"
  url: "https://clinicaltrials.gov/"
  description: "Comprehensive registry and results database of publicly and privately funded clinical studies conducted around the world."
  type: "database"
  access: "free"
  organization: "National Institutes of Health"

- name: "Legal Information Institute (LII)"
  url: "https://www.law.cornell.edu/"
  description: "Nonprofit digital publishing service at Cornell Law School providing free access to the US Code, federal regulations, and Supreme Court opinions."
  type: "database"
  access: "free"
  organization: "Cornell Law School"

- name: "ERIC (Education Resources Information Center)"
  url: "https://eric.ed.gov/"
  description: "Comprehensive digital library of education literature and research sponsored by the US Department of Education."
  type: "database"
  access: "free"
  organization: "Institute of Education Sciences"

- name: "Cochrane Library"
  url: "https://www.cochranelibrary.com/"
  description: "Collection of databases that contain high-quality, independent evidence to inform healthcare decision-making and systematic reviews."
  type: "database"
  access: "freemium"
  organization: "Cochrane"
