- name: "IEEE Xplore Digital Library"
  url: "https://ieeexplore.ieee.org/"
  description: "Premier scientific database delivering research papers, standards, and conference proceedings in electrical engineering and electronics."
  type: "database"
  access: "freemium"
  organization: "IEEE"

- name: "Engineering Village"
  url: "https://www.engineeringvillage.com/"
  description: "Specialized engineering search platform providing access to Compendex, Inspec, and patent databases."
  type: "database"
  access: "paid"
  organization: "Elsevier"

- name: "arXiv: Electrical Engineering and Systems Science"
  url: "https://arxiv.org/"
  description: "Open-access research preprint repository hosting preprints in signal processing, image processing, and systems control."
  type: "database"
  access: "free"
  organization: "Cornell University"

- name: "NASA Technical Reports Server"
  url: "https://www.nasa.gov/"
  description: "Digital collection of aerospace, materials, propulsion, and structural engineering technical reports and historical datasets."
  type: "database"
  access: "free"
  organization: "NASA"
