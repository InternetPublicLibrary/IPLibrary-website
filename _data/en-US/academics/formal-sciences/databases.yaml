- name: "On-Line Encyclopedia of Integer Sequences (OEIS)"
  url: "https://oeis.org/"
  description: "Extensive curated database of integer sequences recording formulas, generating functions, and citations."
  type: "database"
  access: "free"
  organization: "OEIS Foundation"

- name: "L-functions and Modular Forms Database (LMFDB)"
  url: "https://www.lmfdb.org/"
  description: "Comprehensive database of mathematical objects related to L-functions, modular forms, elliptic curves, and number fields."
  type: "database"
  access: "free"
  organization: "LMFDB Collaboration"

- name: "CRAN (Comprehensive R Archive Network)"
  url: "https://cran.r-project.org/"
  description: "Central repository of open-source packages, binaries, and documentation for the R statistical programming environment."
  type: "database"
  access: "free"
  organization: "R Foundation"

- name: "Great Internet Mersenne Prime Search (GIMPS)"
  url: "https://www.mersenne.org/"
  description: "Collaborative project and research database dedicated to searching for and cataloging world-record Mersenne prime numbers."
  type: "database"
  access: "free"
  organization: "GIMPS"
