- name: "Zotero"
  url: "https://www.zotero.org/"
  description: "Free, open-source reference management software designed to collect, organize, annotate, cite, and share research sources."
  type: "tool"
  access: "free"
  organization: "Corporation for Digital Scholarship"

- name: "Voyant Tools"
  url: "https://voyant-tools.org/"
  description: "Web-based reading and analysis environment for digital texts, supporting text mining, frequency analysis, and corpus visualization."
  type: "tool"
  access: "free"
  organization: "Voyant Tools"

- name: "Text Encoding Initiative (TEI)"
  url: "https://tei-c.org/"
  description: "International standard guidelines and software tools for encoding scholarly digital texts in XML."
  type: "tool"
  access: "free"
  organization: "TEI Consortium"

- name: "Omeka"
  url: "https://omeka.org/"
  description: "Open-source web-publishing platform for digital humanities collections, scholarly exhibitions, and cultural heritage archives."
  type: "tool"
  access: "free"
  organization: "Digital Scholar"
