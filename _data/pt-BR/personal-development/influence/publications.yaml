- name: "Negotiation Journal"
  url: "https://direct.mit.edu/ngtn"
  description: "Periódico multidisciplinar internacional de acesso aberto publicado pelo MIT Press e Harvard PON focado em teoria da negociação, influência e resolução de disputas."
  type: "journal"
  language: "en"
  access: "free"
  organization: "MIT Press"

- name: "Organizational Behavior and Human Decision Processes"
  url: "https://www.sciencedirect.com/journal/organizational-behavior-and-human-decision-processes"
  description: "Periódico científico de referência que publica pesquisas fundamentais sobre tomada de decisão, psicologia da persuasão, poder e influência interpessoal."
  type: "journal"
  language: "en"
  access: "paid"
  organization: "Elsevier"

- name: "Revista de Administração Contemporânea"
  url: "https://www.scielo.br/j/rac/"
  description: "Periódico acadêmico brasileiro da ANPAD que divulga estudos científicos sobre comportamento organizacional, negociação corporativa e liderança estratégica."
  type: "journal"
  language: "pt-BR"
  access: "free"
  organization: "Associação Nacional de Pós-Graduação e Pesquisa em Administração"
