- name: "ANBIMA Data"
  url: "https://www.anbima.com.br/"
  description: "Base de dados e estatísticas do mercado de capitais brasileiro mantida pela ANBIMA reunindo taxas de referência, índices e informações sobre fundos."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "Associação Brasileira das Entidades dos Mercados Financeiro e de Capitais"

- name: "SGS - Sistema Gerenciador de Séries Temporais (BCB)"
  url: "https://www.bcb.gov.br/"
  description: "Base de dados oficial do Banco Central com séries históricas diárias e mensais de inflação (IPCA), taxa Selic, juros de mercado e poupança."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "Banco Central do Brasil"

- name: "B3 - Market Data e Cotações"
  url: "https://www.b3.com.br/"
  description: "Repositório oficial da bolsa de valores brasileira com histórico de cotações, composição de índices acionários e dados de negociação de ativos."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "B3 S.A. - Brasil, Bolsa, Balcão"
