- name: "World Happiness Report"
  url: "https://worldhappiness.report/"
  description: "Publicação e repositório global de dados sobre avaliação da qualidade de vida, suporte social e fatores de bem-estar subjetivo em mais de 140 países."
  type: "database"
  language: "en"
  access: "free"
  organization: "Sustainable Development Solutions Network"

- name: "OECD Better Life Index"
  url: "https://www.oecd.org/"
  description: "Base comparativa e indicadores multidimensionais da OCDE sobre satisfação com a vida, saúde, equilíbrio entre trabalho e vida pessoal e bem-estar cívico."
  type: "database"
  language: "en"
  access: "free"
  organization: "OECD"

- name: "Our World in Data - Happiness and Life Satisfaction"
  url: "https://ourworldindata.org/happiness-and-life-satisfaction"
  description: "Repositório aberto de séries históricas e dados empíricos comparativos sobre felicidade, bem-estar subjetivo e desenvolvimento humano."
  type: "database"
  language: "en"
  access: "free"
  organization: "Global Change Data Lab"
