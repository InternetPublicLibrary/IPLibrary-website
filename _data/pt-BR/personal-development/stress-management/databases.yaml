  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "Ministério da Saúde do Brasil"

- name: "Fundacentro - Estatísticas sobre Condições de Trabalho"
  url: "https://www.gov.br/fundacentro/pt-br"
  description: "Base de estudos técnicos e estatísticas ocupacionais da Fundacentro focada na prevenção de riscos psicossociais, fadiga e estresse laboral."
