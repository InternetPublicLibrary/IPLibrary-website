- name: "On-Line Encyclopedia of Integer Sequences (OEIS)"
  url: "https://oeis.org/"
  description: "Extensa base de dados de sequências inteiras com fórmulas, termos geradores, literatura científica e referências cruzadas."
  type: "database"
  language: "en"
  access: "free"
  organization: "OEIS Foundation"

- name: "CRAN (Comprehensive R Archive Network)"
  url: "https://cran.r-project.org/"
  description: "Repositório central oficial de pacotes, códigos-fonte e documentação para análise estatística na linguagem R."
  type: "database"
  language: "en"
  access: "free"
  organization: "R Foundation"

- name: "L-functions and Modular Forms Database (LMFDB)"
  url: "https://www.lmfdb.org/"
  description: "Base de dados colaborativa que cataloga conexões entre funções L, curvas elípticas, formas modulares e corpos numéricos."
  type: "database"
  language: "en"
  access: "free"
  organization: "LMFDB Collaboration"

- name: "Great Internet Mersenne Prime Search (GIMPS)"
  url: "https://www.mersenne.org/"
  description: "Projeto colaborativo de computação distribuída e catálogo de pesquisa sobre números primos de Mersenne."
  type: "database"
  language: "en"
  access: "free"
  organization: "GIMPS"
