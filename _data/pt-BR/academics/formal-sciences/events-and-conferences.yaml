- name: "International Congress of Mathematicians (ICM)"
  url: "https://www.mathunion.org/"
  description: "Conferência quadrienal máxima da matemática mundial organizada pela União Matemática Internacional, onde são entregues as Medalhas Fields."
  type: "conference"
  language: "en"
  access: "free"
  organization: "International Mathematical Union"

- name: "Joint Mathematics Meetings (JMM)"
  url: "https://jointmathematicsmeetings.org/"
  description: "Maior encontro anual de matemática do mundo promovido pela American Mathematical Society."
  type: "conference"
  language: "en"
  access: "free"
  organization: "American Mathematical Society"
