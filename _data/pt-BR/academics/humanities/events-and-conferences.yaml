- name: "Simpósio Nacional de História (SNH)"
  url: "https://anpuh.org.br/"
  description: "Maior encontro acadêmico da área de história no Brasil e na América Latina, promovido bienalmente pela ANPUH desde a década de 1960."
  type: "conference"
  language: "pt-BR"
  access: "free"
  organization: "Associação Nacional de História"

- name: "Encontro Nacional da ANPOF"
  url: "https://anpof.org.br/"
  description: "Principal evento de pesquisa em pós-graduação em filosofia no Brasil, realizado a cada dois anos com apresentação de grupos de trabalho."
  type: "conference"
  language: "pt-BR"
  access: "free"
  organization: "Associação Nacional de Pós-Graduação em Filosofia"

- name: "American Historical Association Annual Meeting"
  url: "https://www.historians.org/"
  description: "Maior reunião anual de historiadores dos Estados Unidos, abrangendo pesquisas e debates sobre todas as épocas e regiões."
  type: "conference"
  language: "en"
  access: "free"
  organization: "American Historical Association"

- name: "Modern Language Association Annual Convention"
  url: "https://www.mla.org/"
  description: "Convenção acadêmica global de referência em estudos linguísticos, literários e culturais organizada anualmente pela MLA."
  type: "conference"
  language: "en"
  access: "free"
  organization: "Modern Language Association"
