- name: "Zotero"
  url: "https://www.zotero.org/"
  description: "Gerenciador de referências bibliográficas livre e de código aberto para coletar, organizar, anotar e citar fontes acadêmicas."
  type: "tool"
  language: "en"
  access: "free"
  organization: "Corporation for Digital Scholarship"

- name: "Voyant Tools"
  url: "https://voyant-tools.org/"
  description: "Ambiente online de leitura e análise textual para humanidades digitais com recursos de mineração de textos e visualização de dados."
  type: "tool"
  language: "en"
  access: "free"
  organization: "Voyant Tools"

- name: "Text Encoding Initiative (TEI)"
  url: "https://tei-c.org/"
  description: "Padrão internacional e conjunto de ferramentas para codificação digital e marcação XML de textos literários e manuscritos históricos."
  type: "tool"
  language: "en"
  access: "free"
  organization: "TEI Consortium"

- name: "Omeka"
  url: "https://omeka.org/"
  description: "Plataforma livre de publicação na web para exposições acadêmicas, arquivos históricos e acervos de patrimônio cultural."
  type: "tool"
  language: "en"
  access: "free"
  organization: "Digital Scholar"
