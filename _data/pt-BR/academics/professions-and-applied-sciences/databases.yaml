- name: "Biblioteca Virtual em Saúde (BVS)"
  url: "https://bvsalud.org/"
  description: "Portal integrado de informação científica em saúde da América Latina e Caribe coordenado pela BIREME/OPAS/OMS."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "BIREME / OPAS / OMS"

- name: "Jusbrasil"
  url: "https://www.jusbrasil.com.br/"
  description: "Plataforma jurídica que centraliza e organiza consulta a jurisprudências, legislação, diários oficiais e doutrina brasileira."
  type: "database"
  language: "pt-BR"
  access: "freemium"
  organization: "Jusbrasil"

- name: "PubMed"
  url: "https://pubmed.ncbi.nlm.nih.gov/"
  description: "Base de dados bibliográfica aberta de biomedicina e ciências da saúde mantida pela Biblioteca Nacional de Medicina dos EUA."
  type: "database"
  language: "en"
  access: "free"
  organization: "National Library of Medicine"

- name: "Cochrane Library"
  url: "https://www.cochranelibrary.com/"
  description: "Coleção de bases de dados com revisões sistemáticas independentes de alta qualidade para tomada de decisão clínica."
  type: "database"
  language: "en"
  access: "freemium"
  organization: "Cochrane"

- name: "ERIC (Education Resources Information Center)"
  url: "https://eric.ed.gov/"
  description: "Base digital de literatura e relatórios de pesquisa educacional patrocinada pelo Departamento de Educação dos EUA."
  type: "database"
  language: "en"
  access: "free"
  organization: "Institute of Education Sciences"
