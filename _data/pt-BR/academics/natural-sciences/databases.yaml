- name: "arXiv"
  url: "https://arxiv.org/"
  description: "Repositório pioneiro de preprints científicos de acesso aberto em física, astronomia e biologia quantitativa gerido por Cornell."
  type: "database"
  language: "en"
  access: "free"
  organization: "Cornell University"

- name: "PubChem"
  url: "https://pubchem.ncbi.nlm.nih.gov/"
  description: "Maior base de dados aberta de química do mundo contendo estruturas moleculares, propriedades e atividades biológicas."
  type: "database"
  language: "en"
  access: "free"
  organization: "National Institutes of Health"

- name: "RCSB Protein Data Bank"
  url: "https://www.rcsb.org/"
  description: "Repositório global primário de estruturas macromoleculares tridimensionais determinadas experimentalmente de proteínas e ácidos nucleicos."
  type: "database"
  language: "en"
  access: "free"
  organization: "RCSB PDB"

- name: "bioRxiv"
  url: "https://www.biorxiv.org/"
  description: "Serviço e arquivo online aberto de preprints para pesquisas em ciências biológicas e biomédicas mantido por Cold Spring Harbor."
  type: "database"
  language: "en"
  access: "free"
  organization: "Cold Spring Harbor Laboratory"

- name: "NASA Astrophysics Data System (ADS)"
  url: "https://ui.adsabs.harvard.edu/"
  description: "Portal bibliográfico de literatura científica em astrofísica, física e geociências operado pelo Smithsonian sob concessão da NASA."
  type: "database"
  language: "en"
  access: "free"
  organization: "Smithsonian Astrophysical Observatory"
