- name: "Encontro Anual da ANPOCS"
  url: "https://anpocs.org.br/"
  description: "Principal fórum anual de pós-graduação e debate acadêmico das ciências sociais no Brasil, congregando antropólogos, sociólogos e cientistas políticos."
  type: "conference"
  language: "pt-BR"
  access: "free"
  organization: "ANPOCS"

- name: "Encontro Nacional de Economia (ANPEC)"
  url: "https://www.anpec.org.br/"
  description: "Mais importante congresso científico de economia do Brasil, organizado anualmente pela ANPEC desde 1973 com apresentação de pesquisas originais."
  type: "conference"
  language: "pt-BR"
  access: "free"
  organization: "ANPEC"

- name: "Allied Social Science Associations Annual Meeting (ASSA)"
  url: "https://www.aeaweb.org/"
  description: "Conferência internacional de ponta promovida pela American Economic Association reunindo economistas e formuladores de políticas públicas."
  type: "conference"
  language: "en"
  access: "free"
  organization: "American Economic Association"

- name: "American Sociological Association Annual Meeting"
  url: "https://www.asanet.org/"
  description: "Encontro anual da Associação Americana de Sociologia que reúne milhares de sociólogos, docentes e pesquisadores sociais."
  type: "conference"
  language: "en"
  access: "free"
  organization: "American Sociological Association"
