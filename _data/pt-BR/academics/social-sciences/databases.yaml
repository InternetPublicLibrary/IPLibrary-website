- name: "Ipeadata"
  url: "https://ipeadata.gov.br/"
  description: "Base de dados macroeconômicos, sociais e regionais do Brasil mantida pelo Instituto de Pesquisa Econômica Aplicada."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "Instituto de Pesquisa Econômica Aplicada"

- name: "SIDRA (Sistema IBGE de Recuperação Automática)"
  url: "https://sidra.ibge.gov.br/"
  description: "Banco oficial de tabelas estatísticas do IBGE com dados agregados de censos demográficos, trabalho, renda e agropecuária."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "Instituto Brasileiro de Geografia e Estatística"

- name: "World Bank Open Data"
  url: "https://data.worldbank.org/"
  description: "Repositório global aberto de indicadores de desenvolvimento socioeconômico e estatísticas comparativas do Banco Mundial."
  type: "database"
  language: "en"
  access: "free"
  organization: "World Bank"

- name: "Our World in Data"
  url: "https://ourworldindata.org/"
  description: "Plataforma científica aberta que analisa dados e tendências globais sobre pobreza, demografia, saúde e meio ambiente."
  type: "database"
  language: "en"
  access: "free"
  organization: "Global Change Data Lab"

- name: "Federal Reserve Economic Data (FRED)"
  url: "https://fred.stlouisfed.org/"
  description: "Base de séries temporais econômicas globais e norte-americanas mantida pelo Federal Reserve Bank of St. Louis."
  type: "database"
  language: "en"
  access: "free"
  organization: "Federal Reserve Bank of St. Louis"
