- name: "R Project for Statistical Computing"
  url: "https://www.r-project.org/"
  description: "Ambiente e linguagem de programação de código aberto amplamente utilizado nas ciências sociais para econometria, psicometria e modelagem estatística."
  type: "tool"
  language: "en"
  access: "free"
  organization: "R Foundation"

- name: "JASP"
  url: "https://jasp-stats.org/"
  description: "Programa estatístico gratuito e de código aberto com interface visual intuitiva para métodos estatísticos frequentistas e bayesianos."
  type: "tool"
  language: "en"
  access: "free"
  organization: "University of Amsterdam"

- name: "Gephi"
  url: "https://gephi.org/"
  description: "Software de código aberto para exploração, visualização e análise de redes complexas e grafos em pesquisas sociológicas e políticas."
  type: "tool"
  language: "en"
  access: "free"
  organization: "Gephi Consortium"

- name: "OpenRefine"
  url: "https://openrefine.org/"
  description: "Ferramenta livre e poderosa para limpeza, enriquecimento e transformação de dados tabulares quantitativos e qualitativos."
  type: "tool"
  language: "en"
  access: "free"
  organization: "OpenRefine"
