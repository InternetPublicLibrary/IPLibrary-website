- name: "Congresso da Sociedade Brasileira de Computação (CSBC)"
  url: "https://csbc.sbc.org.br/"
  description: "Maior evento científico de computação e informática do Brasil e da América Latina, reunindo pesquisadores e simpósios temáticos anuais."
  type: "conference"
  language: "pt-BR"
