  organization: "Sociedade Brasileira de Computação"

- name: "Maratona SBC de Programação"
  url: "https://maratona.sbc.org.br/"
  description: "Competição nacional anual de algoritmos e programação para estudantes universitários, classificatória brasileira do ICPC."
  type: "conference"
  language: "pt-BR"
  access: "free"
  organization: "Sociedade Brasileira de Computação"

- name: "Olimpíada Brasileira de Informática (OBI)"
  url: "https://olimpiada.ic.unicamp.br/"
