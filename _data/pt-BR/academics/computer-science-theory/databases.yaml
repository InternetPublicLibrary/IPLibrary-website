- name: "SBC OpenLib (SOL)"
  url: "https://sol.sbc.org.br/"
  description: "Biblioteca digital de acesso aberto da Sociedade Brasileira de Computação, reunindo anais de congressos, periódicos e livros da área."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "Sociedade Brasileira de Computação"

- name: "dblp Computer Science Bibliography"
  url: "https://dblp.org/"
  description: "Base de dados bibliográfica aberta com indexação abrangente de conferências e periódicos em computação teórica e aplicada."
  type: "database"
  language: "en"
  access: "free"
  organization: "Schloss Dagstuhl"

- name: "Complexity Zoo"
  url: "https://complexityzoo.net/Complexity_Zoo"
  description: "Enciclopédia em formato wiki que cataloga classes de complexidade computacional e suas relações de inclusão e equivalência."
  type: "database"
  language: "en"
  access: "free"
  organization: "Complexity Zoo"

- name: "Cryptology ePrint Archive"
  url: "https://eprint.iacr.org/"
  description: "Repositório científico de preprints e relatórios técnicos em criptografia teórica mantido pela IACR."
  type: "database"
  language: "en"
  access: "free"
  organization: "International Association for Cryptologic Research"

- name: "Quantum Algorithm Zoo"
  url: "https://quantumalgorithmzoo.org/"
  description: "Catálogo abrangente de algoritmos quânticos com análise de ganhos de desempenho em relação a métodos clássicos."
  type: "database"
  language: "en"
  access: "free"
  organization: "Stephen Jordan"
