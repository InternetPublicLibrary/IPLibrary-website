- name: "Acervo Digital do MASP (Coleção Rhodia)"
  url: "https://masp.org.br/"
  description: "Acervo histórico digitalizado do Museu de Arte de São Paulo que reúne peças emblemáticas da união entre arte, moda e indústria têxtil brasileira."
  type: "database"
  access: "free"
  language: "pt-BR"
  organization: "Museu de Arte de São Paulo"

- name: "Europeana Fashion"
  url: "https://www.europeana.eu/en/collections/topic/fashion"
  description: "Repositório digital aberto que agrega centenas de milhares de artefatos históricos de moda, croquis e têxteis de museus europeus."
  type: "database"
  access: "free"
  language: "en"
  organization: "Europeana Foundation"

- name: "The Costume Institute Collection (Met Museum)"
  url: "https://www.metmuseum.org/art/collection"
  description: "Arquivo digitalizado com mais de trinta mil peças de vestuário e acessórios documentando séculos da história mundial da indumentária."
  type: "database"
  access: "free"
  language: "en"
  organization: "The Metropolitan Museum of Art"
