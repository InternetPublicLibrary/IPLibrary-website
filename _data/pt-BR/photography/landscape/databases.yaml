- name: "Light Pollution Map"
  url: "https://www.lightpollutionmap.info/"
  description: "Base de dados cartográfica interativa exibindo níveis globais de poluição luminosa para planejamento de astrofotografia."
  type: "database"
  language: "en"
  access: "free"

- name: "PeakFinder"
  url: "https://www.peakfinder.com/"
  description: "Base de dados topográfica global que gera vistas panorâmicas em 360 graus com nomes de montanhas a partir de qualquer coordenada."
  type: "database"
  language: "en"
  access: "freemium"
  organization: "PeakFinder"

- name: "USGS EarthExplorer"
  url: "https://earthexplorer.usgs.gov/"
  description: "Base de dados geoespacial com imagens de satélite, dados de elevação e fotografias aéreas para reconhecimento de locações."
  type: "database"
  language: "en"
  access: "free"
  organization: "United States Geological Survey"
