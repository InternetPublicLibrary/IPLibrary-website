  organization: "Instituto Moreira Salles"

- name: "National Geographic Image Collection"
  url: "https://www.nationalgeographic.com/photography/"
  description: "Arquivo fotográfico histórico e contemporâneo documentando expedições exploratórias, povos e paisagens do planeta."
  type: "database"
  language: "en"
  access: "free"
  organization: "National Geographic Society"
