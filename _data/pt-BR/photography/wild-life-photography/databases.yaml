- name: "WikiAves"
  url: "https://www.wikiaves.com.br/"
  description: "Maior plataforma colaborativa brasileira de observadores e fotógrafos de aves com milhões de registros fotográficos da fauna."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "WikiAves"

- name: "iNaturalist"
  url: "https://www.inaturalist.org/"
  description: "Rede global de ciência cidadã com mapeamento georreferenciado e registros fotográficos da fauna e flora mundiais."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "California Academy of Sciences & National Geographic Society"

- name: "Macaulay Library"
  url: "https://www.macaulaylibrary.org/"
  description: "Maior arquivo científico de mídia animal do mundo com fotos, gravações sonoras e vídeos de espécies da vida selvagem."
  type: "database"
  language: "en"
  access: "free"
  organization: "Cornell Lab of Ornithology"
