- name: "Catálogo de Normas da ABNT (ABNT Catálogo)"
  url: "https://www.abntcatalogo.com.br"
  description: "Ferramenta oficial para consulta e aquisição de normas técnicas industriais brasileiras (NBR) e internacionais (ISO)."
  type: "tool"
  language: "pt-BR"
  access: "freemium"
  organization: "Associação Brasileira de Normas Técnicas"

- name: "Sistema de Metrologia e Avaliação da Conformidade do Inmetro"
  url: "https://www.gov.br/inmetro"
  description: "Plataforma de consulta a regulamentos técnicos, selos de conformidade e calibração de instrumentos de medição industrial."
  type: "tool"
  language: "pt-BR"
  access: "free"
  organization: "Instituto Nacional de Metrologia, Qualidade e Tecnologia"

- name: "Comex Stat"
  url: "https://comexstat.mdic.gov.br"
  description: "Ferramenta oficial do governo brasileiro para consultas detalhadas sobre exportações e importações da indústria de transformação."
  type: "tool"
  language: "pt-BR"
  access: "free"
  organization: "Ministério do Desenvolvimento, Indústria, Comércio e Serviços"
