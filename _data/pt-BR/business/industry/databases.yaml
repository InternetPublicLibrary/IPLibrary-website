  description: "Indicadores industriais mensais, sondagem industrial, índice de confiança do empresário industrial (ICEI) e capacidade instalada."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "Confederação Nacional da Indústria"

- name: "Pesquisa Industrial Mensal (PIM-PF) - IBGE"
  url: "https://www.ibge.gov.br"
  description: "Dados estatísticos oficiais sobre o volume e a evolução da produção física da indústria extrativa e de transformação no Brasil."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "Instituto Brasileiro de Geografia e Estatística"

- name: "Banco de Dados da Indústria Brasileira de Máquinas (ABIMAQ)"
  url: "https://abimaq.org.br"
  description: "Dados estatísticos e séries de faturamento, exportações e consumo aparente do setor de bens de capital mecânicos."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "Associação Brasileira da Indústria de Máquinas e Equipamentos"
