- name: "Observatório Nacional de Transporte e Logística (ONTL)"
  url: "https://ontl.infrasa.gov.br"
  description: "Núcleo de inteligência de dados da Infra S.A. que monitora fluxos de carga, custos logísticos e infraestrutura de transportes no Brasil."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "Infra S.A."

- name: "Panorama ILOS de Logística"
  url: "https://ilos.com.br"
  description: "Pesquisas empíricas anuais e relatórios de benchmarking sobre custos operacionais de cadeia de suprimentos e nível de serviço no Brasil."
  type: "database"
  language: "pt-BR"
  access: "freemium"
  organization: "Instituto de Logística e Supply Chain"

- name: "Boletim CNT do Transporte"
  url: "https://www.cnt.org.br"
  description: "Bases de dados e pesquisas periódicas da Confederação Nacional do Transporte sobre rodovias, ferrovias e eficiência operacional."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "Confederação Nacional do Transporte"
