- name: "Portal Brasileiro de Dados Abertos"
  url: "https://dados.gov.br"
  description: "Catálogo centralizado de dados abertos governamentais do Brasil para análises econômicas, orçamentárias e sociais."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "Governo Federal do Brasil"

- name: "Base dos Dados"
  url: "https://basedosdados.org"
  description: "Plataforma pública que limpa, integra e disponibiliza bases de dados socioeconômicas brasileiras via BigQuery e API."
  type: "database"
  language: "pt-BR"
  access: "free"
  organization: "Base dos Dados"

- name: "Ipeadata"
  url: "https://www.ipeadata.gov.br"
  description: "Base macroeconômica, regional e social mantida pelo Instituto de Pesquisa Econômica Aplicada com séries temporais históricas."
