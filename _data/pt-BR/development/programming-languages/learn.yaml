- name: "Curso em Vídeo - Python"
  url: "https://www.cursoemvideo.com"
  description: "Curso introdutório gratuito e completo em português ministrado por Gustavo Guanabara cobrindo lógica, estruturas e orientação a objetos."
  type: "course"
  access: "free"
  language: "pt-BR"
  organization: "Curso em Vídeo"

- name: "The Rust Programming Language"
  url: "https://doc.rust-lang.org/book/"
  description: "Livro oficial introdutório e aprofundado sobre Rust cobrindo conceitos de propriedade (ownership), borrowing e sistemas de tipos."
  type: "textbook"
  access: "free"
  language: "en"
  organization: "Rust Community"

- name: "Kotlin Documentation"
  url: "https://kotlinlang.org/docs/home.html"
  description: "Documentação oficial da linguagem Kotlin, com tour, referência e guias para Android, servidor e multiplataforma."
  type: "reference"
  access: "free"
  language: "en"
  organization: "JetBrains"

- name: "Swift Documentation"
  url: "https://www.swift.org/documentation/"
  description: "Documentação oficial da linguagem Swift, com o guia da linguagem, a biblioteca padrão e diretrizes de API."
  type: "reference"
  access: "free"
  language: "en"
  organization: "Swift.org"

- name: "The Python Tutorial"
  url: "https://docs.python.org/3/tutorial/"
  description: "Introdução oficial ao Python, cobrindo sintaxe, estruturas de dados, módulos, erros e classes para quem está começando."
  type: "tutorial"
  access: "free"
  language: "en"
  organization: "Python Software Foundation"

- name: "Python for Everybody"
  url: "https://www.py4e.com/"
  description: "Curso gratuito para iniciantes, com livro aberto, que ensina programação em Python, estruturas de dados, web e bancos."
  type: "course"
  access: "free"
  language: "en"
  organization: "University of Michigan"

- name: "Automate the Boring Stuff with Python"
  url: "https://automatetheboringstuff.com/"
  description: "Livro online gratuito que ensina Python automatizando arquivos, planilhas, páginas web e tarefas do dia a dia."
  type: "textbook"
  access: "free"
  language: "en"
  organization: "No Starch Press"

- name: "PEP 8: Style Guide for Python Code"
  url: "https://peps.python.org/pep-0008/"
  description: "Guia oficial de estilo para código Python, com convenções de nomes, layout e boas práticas de legibilidade."
  type: "reference"
  access: "free"
  language: "en"
  organization: "Python Software Foundation"

