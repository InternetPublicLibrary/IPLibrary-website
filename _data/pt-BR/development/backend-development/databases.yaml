- name: "PostgreSQL"
  url: "https://www.postgresql.org"
  description: "Sistema de gerenciamento de banco de dados relacional e objeto-relacional de código aberto com conformidade ACID e recursos avançados."
  type: "database"
  access: "free"
  language: "en"
  organization: "PostgreSQL Global Development Group"

- name: "Redis"
  url: "https://redis.io"
  description: "Armazenamento em memória usado como banco de dados em chave-valor, cache distribuído e intermediário de mensagens de baixa latência."
  type: "database"
  access: "free"
  language: "en"
  organization: "Redis Ltd."

- name: "MongoDB"
  url: "https://www.mongodb.com"
  description: "Banco de dados orientado a documentos NoSQL com esquemas flexíveis baseados em JSON projetado para alta escalabilidade horizontal."
  type: "database"
  access: "freemium"
  language: "en"
  organization: "MongoDB, Inc."

- name: "SQLite"
  url: "https://www.sqlite.org"
  description: "Motor de banco de dados SQL embutido, autocontido e sem servidor amplamente empregado em testes e aplicações locais."
  type: "database"
  access: "free"
  language: "en"
  organization: "SQLite Consortium"

- name: "Apache Kafka"
  url: "https://kafka.apache.org"
  description: "Plataforma distribuída de streaming de eventos para ingestão, processamento e integração de dados em tempo real em arquiteturas de microsserviços."
  type: "database"
  access: "free"
  language: "en"
  organization: "Apache Software Foundation"
