- name: "Test-Driven Development by Example"
  url: "https://www.oreilly.com"
  description: "Livro seminal de Kent Beck que consolidou a metodologia TDD baseada no ciclo Red/Green/Refactor para testes automatizados."
  type: "textbook"
  access: "paid"
  language: "en"
  organization: "Kent Beck / Addison-Wesley"

- name: "Playwright Documentation"
  url: "https://playwright.dev"
  description: "Documentação oficial completa com tutoriais práticos, guias de assertions, fixtures e execução paralela em CI/CD."
  type: "reference"
  access: "free"
  language: "en"
  organization: "Microsoft"

- name: "BSTQB - Sílabos Oficiais"
  url: "https://bstqb.org.br"
  description: "Guias de estudo completos gratuitos em português cobrindo fundamentos, técnicas de caixa-preta e automação de testes."
  type: "textbook"
  access: "free"
  language: "pt-BR"
  organization: "BSTQB"

- name: "Roadmap QA Engineer (roadmap.sh)"
  url: "https://roadmap.sh/qa"
  description: "Roadmap interativo sobre garantia de qualidade de software: os temas em uma ordem de estudo sugerida, cada um com links para aprofundamento."
  type: "reference"
  access: "free"
  language: "en"
  organization: "roadmap.sh"
