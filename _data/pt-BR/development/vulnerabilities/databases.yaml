- name: "National Vulnerability Database (NVD)"
  url: "https://nvd.nist.gov"
  description: "Repositório governamental de dados de vulnerabilidades mantido pelo NIST com pontuações CVSS, impacto e correlações técnicas."
  type: "database"
  access: "free"
  language: "en"
  organization: "National Institute of Standards and Technology (NIST)"

- name: "CVE Program"
  url: "https://www.cve.org"
  description: "Dicionário internacional canônico que atribui identificadores universais padronizados para vulnerabilidades de segurança pública."
  type: "database"
  access: "free"
  language: "en"
  organization: "MITRE Corporation / CISA"

- name: "Common Weakness Enumeration (CWE)"
  url: "https://cwe.mitre.org"
  description: "Dicionário formal e taxonomia estruturada de tipos de fraquezas e falhas de arquitetura em software e hardware."
  type: "database"
  access: "free"
  language: "en"
  organization: "MITRE Corporation"
