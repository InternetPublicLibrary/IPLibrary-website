  description: "Catálogo interativo que mapeia e categoriza centenas de projetos de código aberto e soluções proprietárias do ecossistema cloud-native."
  type: "database"
  access: "free"
  language: "en"
  organization: "Cloud Native Computing Foundation"

- name: "Artifact Hub"
  url: "https://artifacthub.io"
  description: "Repositório centralizado de pacotes cloud-native, incluindo Helm charts, plugins e operadores para plataformas Kubernetes."
  type: "database"
  access: "free"
  language: "en"
  organization: "Cloud Native Computing Foundation"

- name: "Terraform Registry"
  url: "https://registry.terraform.io"
  description: "Diretório oficial de módulos e provedores gerenciados pela comunidade e fabricantes para provisionamento de infraestrutura em nuvem."
  type: "database"
  access: "free"
  language: "en"
  organization: "HashiCorp"
