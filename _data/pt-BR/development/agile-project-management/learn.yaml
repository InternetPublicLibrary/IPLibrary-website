- name: "The Scrum Guide"
  url: "https://scrumguides.org"
  description: "Guia definitivo do framework Scrum mantido pelos criadores Ken Schwaber e Jeff Sutherland, disponível oficialmente em português."
  type: "reference"
  access: "free"
  language: "pt-BR"
  organization: "Scrum.org"

- name: "Manifesto para o Desenvolvimento Ágil de Software"
  url: "https://agilemanifesto.org"
  description: "Declaração histórica dos quatro valores e doze princípios fundamentais que regem o desenvolvimento de software ágil."
  type: "reference"
  access: "free"
  language: "pt-BR"
  organization: "Agile Alliance"

- name: "Kanban University"
  url: "https://kanban.university"
  description: "Guias essenciais e padrões de conhecimento para a aplicação prática do Método Kanban em fluxos de trabalho do conhecimento."
  type: "reference"
  access: "free"
  language: "en"
  organization: "Kanban University"

- name: "Alura - Formação Métodos Ágeis"
  url: "https://www.alura.com.br"
  description: "Plataforma brasileira de tecnologia que oferece cursos práticos sobre Scrum, Kanban, facilitação e gestão ágil de projetos."
  type: "course"
  access: "paid"
  language: "pt-BR"
  organization: "Alura"
