- name: "Common Crawl"
  url: "https://commoncrawl.org/"
  description: "Repositório aberto com petabytes de dados rastreados da web, amplamente utilizado em benchmarks de processamento distribuído."
  type: "database"
  access: "free"
  language: "en"
  organization: "Common Crawl Foundation"

- name: "Registry of Open Data on AWS"
  url: "https://registry.opendata.aws/"
  description: "Catálogo de bases de dados abertas hospedadas em nuvem para computação de alto desempenho e análise distribuída."
  type: "database"
  access: "free"
  language: "en"
  organization: "Amazon Web Services"

- name: "Portal Brasileiro de Dados Abertos"
  url: "https://dados.gov.br/"
  description: "Plataforma com grandes volumes de dados governamentais abertos para exploração e processamento analítico distribuído."
  type: "database"
  access: "free"
  language: "pt-BR"
  organization: "Governo Digital do Brasil"

- name: "Kaggle Datasets"
  url: "https://www.kaggle.com/datasets"
  description: "Plataforma colaborativa de bases de dados de grande escala para treinamento paralelo e análise empírica."
  type: "database"
  access: "free"
  language: "en"
  organization: "Kaggle"
