- name: "Designing Data-Intensive Applications"
  url: "https://dataintensive.net/"
  description: "Obra de Martin Kleppmann que explora arquiteturas, consistência, transações e particionamento em sistemas de dados distribuídos."
  type: "textbook"
  access: "paid"
  language: "en"
  organization: "Martin Kleppmann / O'Reilly"

- name: "Distributed Systems (van Steen and Tanenbaum)"
  url: "https://www.distributed-systems.net/"
  description: "Livro acadêmico aberto sobre arquiteturas, comunicação entre processos, coordenação e tolerância a falhas em sistemas distribuídos."
  type: "textbook"
  access: "free"
  language: "en"
  organization: "Maarten van Steen and Andrew S. Tanenbaum"

- name: "Documentação do Kubernetes"
  url: "https://kubernetes.io/docs/"
  description: "Guias oficiais e especificações de arquitetura de clusters distribuídos e orquestração de microsserviços."
  type: "reference"
  access: "free"
  language: "en"
  organization: "Cloud Native Computing Foundation"

- name: "Documentação do Apache Spark"
  url: "https://spark.apache.org/docs/"
  description: "Manuais técnicos de programação e guias de otimização de execução de tarefas distribuídas no Spark."
  type: "reference"
  access: "free"
  language: "en"
  organization: "Apache Software Foundation"

