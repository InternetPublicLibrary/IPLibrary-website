- name: "Wireshark"
  url: "https://www.wireshark.org/"
  description: "Analisador de protocolos de rede de código aberto para captura e inspeção interativa de pacotes em tempo real."
  type: "tool"
  access: "free"
  language: "en"
  organization: "Wireshark Foundation"

- name: "Nmap"
  url: "https://nmap.org/"
  description: "Utilitário de código aberto para varredura de portas, descoberta de ativos de rede e auditoria de segurança."
  type: "tool"
  access: "free"
  language: "en"
  organization: "Insecure.Com LLC"

- name: "tcpdump"
  url: "https://www.tcpdump.org/"
  description: "Poderoso analisador de pacotes de linha de comando baseado na biblioteca de captura libpcap."
  type: "tool"
  access: "free"
  language: "en"
  organization: "The Tcpdump Group"

- name: "IX.br"
  url: "https://ix.br/"
  description: "Infraestrutura de pontos de troca de tráfego internet (PTT) gerenciada pelo NIC.br para interconexão e roteamento no Brasil."
  type: "tool"
  access: "free"
  language: "pt-BR"
  organization: "NIC.br"
