- name: "KiCad"
  url: "https://www.kicad.org/"
  description: "Suíte de código aberto para automação de projeto eletrônico (EDA), captura esquemática e layout de placas de circuito impresso (PCB)."
  type: "tool"
  access: "free"
  language: "en"
  organization: "KiCad Project"

- name: "Verilator"
  url: "https://www.verilator.org/"
  description: "Compilador e simulador de código aberto de Verilog e SystemVerilog que traduz descrições de hardware para C++."
  type: "tool"
  access: "free"
  language: "en"
  organization: "Veripool"

- name: "GHDL"
  url: "https://ghdl.github.io/ghdl/"
  description: "Analisador, compilador e simulador de código aberto para a linguagem de descrição de hardware VHDL."
  type: "tool"
  access: "free"
  language: "en"
  organization: "GHDL Project"

- name: "Arduino IDE"
  url: "https://www.arduino.cc/en/software"
  description: "Ambiente de desenvolvimento para prototipagem rápida, compilação e gravação de código em microcontroladores."
  type: "tool"
  access: "free"
  language: "en"
  organization: "Arduino"
