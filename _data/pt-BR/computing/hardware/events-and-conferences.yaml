- name: "SBCCI (Simpósio Brasileiro de Concepção de Circuitos e Sistemas Integrados)"
  url: "https://sol.sbc.org.br/index.php/sbcci"
  description: "Principal fórum científico brasileiro sobre projeto de circuitos integrados, microeletrônica e sistemas em chip."
  type: "conference"
  access: "paid"
  language: "pt-BR"
  organization: "Sociedade Brasileira de Computação"

- name: "ISCA (International Symposium on Computer Architecture)"
  url: "https://iscaconf.org/"
  description: "Encontro acadêmico anual de maior prestígio internacional em arquitetura e projeto de computadores."
  type: "conference"
  access: "paid"
  language: "en"
  organization: "ACM SIGARCH and IEEE TCCA"

- name: "DAC (Design Automation Conference)"
  url: "https://www.dac.com/"
  description: "Conferência e feira técnica internacional líder em automação de projeto de sistemas eletrônicos e chips."
  type: "conference"
  access: "paid"
  language: "en"
  organization: "ACM SIGDA and IEEE CEDA"

- name: "MICRO (IEEE/ACM International Symposium on Microarchitecture)"
  url: "https://microarch.org/"
  description: "Encontro internacional voltado à microarquitetura de processadores e compiladores de hardware."
  type: "conference"
  access: "paid"
  language: "en"
  organization: "IEEE Computer Society and ACM SIGMICRO"
