- name: "SBC OpenLib (SOL)"
  url: "https://sol.sbc.org.br/"
  description: "Biblioteca digital aberta que reúne a produção científica da comunidade brasileira de computação em eventos e periódicos."
  type: "database"
  access: "free"
  language: "pt-BR"
  organization: "Sociedade Brasileira de Computação"

- name: "ACM Digital Library"
  url: "https://dl.acm.org/"
  description: "Acervo e índice bibliográfico internacional de publicações, anais e livros em ciência da computação."
  type: "database"
  access: "freemium"
  language: "en"
  organization: "Association for Computing Machinery"

- name: "IEEE Xplore Digital Library"
  url: "https://ieeexplore.ieee.org/"
  description: "Base de pesquisas científicas com milhões de artigos revisados por pares e normas técnicas em computação e engenharia."
  type: "database"
  access: "freemium"
  language: "en"
  organization: "IEEE"

- name: "arXiv Computer Science"
  url: "https://arxiv.org/archive/cs"
  description: "Repositório de preprints abertos contendo pesquisas acadêmicas recentes em todas as subáreas da ciência da computação."
  type: "database"
  access: "free"
  language: "en"
  organization: "Cornell University"
