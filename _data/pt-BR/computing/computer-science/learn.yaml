  type: "textbook"
  access: "paid"
  language: "en"
  organization: "The MIT Press"

- name: "Computer Systems: A Programmer's Perspective (CS:APP)"
  url: "https://csapp.cs.cmu.edu/"
  description: "Livro de referência sobre a integração de hardware, sistemas operacionais e compiladores."
  type: "textbook"
  access: "freemium"
  language: "en"
  organization: "Carnegie Mellon University"

- name: "Teach Yourself Computer Science"
  url: "https://teachyourselfcs.com/"
  description: "Guia didático estruturado com roteiro de estudos, livros recomendados e disciplinas fundamentais em computação."
  type: "course"
  access: "free"
  language: "en"
  organization: "Bradfield School of Computer Science"

- name: "Operating Systems: Three Easy Pieces (OSTEP)"
  url: "https://pages.cs.wisc.edu/~remzi/OSTEP/"
  description: "Livro didático aberto cobrindo conceitos essenciais de virtualização, concorrência e persistência em sistemas operacionais."
  type: "textbook"
  access: "free"
  language: "en"
  organization: "University of Wisconsin-Madison"

