- name: "OWASP ZAP (Zed Attack Proxy)"
  url: "https://owasp.org/"
  description: "Scanner de segurança de aplicações web de código aberto para detecção de vulnerabilidades durante o desenvolvimento."
  type: "tool"
  access: "free"
  language: "en"
  organization: "OWASP Foundation"

- name: "Wireshark"
  url: "https://www.wireshark.org/"
  description: "Analisador de protocolos de rede de código aberto para inspeção profunda de tráfego e análise forense de segurança."
  type: "tool"
  access: "free"
  language: "en"
  organization: "Wireshark Foundation"

- name: "Kali Linux"
  url: "https://www.kali.org/"
  description: "Distribuição Linux de código aberto voltada para testes de invasão e auditoria avançada de segurança da informação."
  type: "tool"
  access: "free"
  language: "en"
  organization: "Offensive Security"

- name: "Center for Internet Security (CIS) Benchmarks"
  url: "https://www.cisecurity.org/"
  description: "Diretrizes consensuais de segurança para endurecimento (hardening) de sistemas operacionais, redes e bancos de dados."
  type: "tool"
  access: "free"
  language: "en"
  organization: "Center for Internet Security"
