- name: "National Vulnerability Database (NVD)"
  url: "https://nvd.nist.gov/"
  description: "Repositório governamental de vulnerabilidades mantido pelo NIST com pontuações de impacto CVSS e checklists."
  type: "database"
  access: "free"
  language: "en"
  organization: "National Institute of Standards and Technology"

- name: "MITRE ATT&CK"
  url: "https://attack.mitre.org/"
  description: "Base de conhecimento global sobre táticas e técnicas de adversários cibernéticos observadas no mundo real."
  type: "database"
  access: "free"
  language: "en"
  organization: "The MITRE Corporation"

- name: "CVE Program"
  url: "https://www.cve.org/"
  description: "Catálogo internacional padronizado de identificação e referência de vulnerabilidades de segurança pública."
  type: "database"
  access: "free"
  language: "en"
  organization: "The MITRE Corporation"

- name: "CERT.br - Estatísticas de Incidentes"
  url: "https://www.cert.br/"
  description: "Dados estatísticos e relatórios consolidados sobre incidentes de segurança notificados em redes no Brasil."
  type: "database"
  access: "free"
  language: "pt-BR"
  organization: "NIC.br / CGI.br"
