- name: "PostgreSQL"
  url: "https://www.postgresql.org/"
  description: "Poderoso sistema gerenciador de banco de dados relacional e objeto-relacional de código aberto com conformidade aos padrões SQL."
  type: "tool"
  access: "free"
  language: "en"
  organization: "PostgreSQL Global Development Group"

- name: "SQLite"
  url: "https://www.sqlite.org/"
  description: "Motor de banco de dados SQL embutido, autocontido, de alta confiabilidade e amplamente distribuído no mundo."
  type: "tool"
  access: "free"
  language: "en"
  organization: "SQLite Consortium"

- name: "Redis"
  url: "https://redis.io/"
  description: "Armazenamento de estrutura de dados em memória de alta performance usado como banco de dados em cache e mensageria."
  type: "tool"
  access: "free"
  language: "en"
  organization: "Redis Ltd."

- name: "DBeaver"
  url: "https://dbeaver.io/"
  description: "Cliente SQL universal e ferramenta gráfica de administração de dados com suporte a bancos relacionais e NoSQL."
  type: "tool"
  access: "free"
  language: "en"
  organization: "DBeaver Community"

- name: "Apache Cassandra"
  url: "https://cassandra.apache.org/"
  description: "Banco de dados NoSQL distribuído projetado para oferecer alta disponibilidade e escalabilidade linear em múltiplos nós."
  type: "tool"
  access: "free"
  language: "en"
  organization: "Apache Software Foundation"
