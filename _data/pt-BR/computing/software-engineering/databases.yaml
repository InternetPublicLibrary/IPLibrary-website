- name: "CVE (Common Vulnerabilities and Exposures)"
  url: "https://www.cve.org/"
  description: "Catálogo internacional padronizado de vulnerabilidades de segurança conhecidas em sistemas de software."
  type: "database"
  access: "free"
  language: "en"
  organization: "The MITRE Corporation"

- name: "CWE (Common Weakness Enumeration)"
  url: "https://cwe.mitre.org/"
  description: "Dicionário e taxonomia comunitária de falhas arquiteturais e fraquezas comuns de implementação em software."
  type: "database"
  access: "free"
  language: "en"
  organization: "The MITRE Corporation"

- name: "OSV (Open Source Vulnerabilities)"
  url: "https://osv.dev/"
  description: "Base de dados aberta e distribuída de vulnerabilidades em ecossistemas de pacotes e dependências de código aberto."
  type: "database"
  access: "free"
  language: "en"
  organization: "Google"
