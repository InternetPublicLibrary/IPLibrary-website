- name: "BRACIS (Brazilian Conference on Intelligent Systems)"
  url: "https://bracis.sbc.org.br/"
  description: "Conferência brasileira que reúne pesquisadores e profissionais para debater inteligência artificial e aprendizado de máquina."
  type: "conference"
  access: "paid"
  language: "pt-BR"
  organization: "Sociedade Brasileira de Computação"

- name: "NeurIPS (Conference on Neural Information Processing Systems)"
  url: "https://neurips.cc/"
  description: "Principal evento acadêmico anual de nível internacional em redes neurais artificiais e aprendizado de máquina."
  type: "conference"
  access: "paid"
  language: "en"
  organization: "Neural Information Processing Systems Foundation"

- name: "ICML (International Conference on Machine Learning)"
  url: "https://icml.cc/"
  description: "Conferência internacional líder dedicada à apresentação e publicação de pesquisas fundamentais em machine learning."
  type: "conference"
  access: "paid"
  language: "en"
  organization: "International Machine Learning Society"

- name: "ICLR (International Conference on Learning Representations)"
  url: "https://iclr.cc/"
  description: "Encontro acadêmico internacional especializado em aprendizado de representações e arquiteturas de redes neurais profundas."
  type: "conference"
  access: "paid"
  language: "en"
  organization: "ICLR"
