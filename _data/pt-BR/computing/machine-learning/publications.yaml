- name: "Journal of Machine Learning Research (JMLR)"
  url: "https://www.jmlr.org/"
  description: "Periódico científico de acesso aberto e revisão por pares dedicado à publicação de pesquisas teóricas e empíricas em machine learning."
  type: "journal"
  access: "free"
  language: "en"
  organization: "JMLR"

- name: "Transactions on Machine Learning Research (TMLR)"
  url: "https://jmlr.org/tmlr/"
  description: "Periódico científico de acesso aberto focado na disseminação ágil de pesquisas inovadoras em aprendizado de máquina."
  type: "journal"
  access: "free"
  language: "en"
  organization: "JMLR"

- name: "Journal of the Brazilian Computer Society (JBCS)"
  url: "https://journals-sol.sbc.org.br/index.php/jbcs"
  description: "Revista científica revisada por pares que divulga avanços teóricos e aplicados em computação e aprendizado de máquina no Brasil."
  type: "journal"
  access: "free"
  language: "en"
  organization: "Sociedade Brasileira de Computação"

- name: "Distill"
  url: "https://distill.pub/"
  description: "Publicação digital aberta voltada à comunicação visual, interativa e rigorosa de conceitos e avanços em machine learning."
  type: "journal"
  access: "free"
  language: "en"
  organization: "Distill Working Group"
