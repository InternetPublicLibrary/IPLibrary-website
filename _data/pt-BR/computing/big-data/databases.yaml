- name: "Common Crawl"
  url: "https://commoncrawl.org/"
  description: "Repositório aberto de petabytes de dados de rastreamento da web global para pesquisas e análise de big data."
  type: "database"
  access: "free"
  language: "en"
  organization: "Common Crawl Foundation"

- name: "Registry of Open Data on AWS"
  url: "https://registry.opendata.aws/"
  description: "Catálogo público de conjuntos de dados de grande escala hospedados em nuvem para uso em pesquisas e análise de dados."
  type: "database"
  access: "free"
  language: "en"
  organization: "Amazon Web Services"

- name: "Portal Brasileiro de Dados Abertos"
  url: "https://dados.gov.br/"
  description: "Catálogo nacional de dados abertos governamentais que reúne grandes volumes de dados públicos da administração federal."
  type: "database"
  access: "free"
  language: "pt-BR"
  organization: "Governo Digital do Brasil"

- name: "Kaggle Datasets"
  url: "https://www.kaggle.com/datasets"
  description: "Plataforma pública com bases de dados em larga escala para desafios de engenharia analítica e machine learning."
  type: "database"
  access: "free"
  language: "en"
  organization: "Kaggle"
