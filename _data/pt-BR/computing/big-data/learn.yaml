- name: "Designing Data-Intensive Applications"
  url: "https://dataintensive.net/"
  description: "Livro de referência de Martin Kleppmann sobre princípios de arquitetura de dados distribuídos, tolerância a falhas e escalabilidade."
  type: "textbook"
  access: "paid"
  language: "en"
  organization: "O'Reilly Media"

- name: "Distributed Systems"
  url: "https://www.distributed-systems.net/"
  description: "Livro didático aberto de Maarten van Steen e Andrew S. Tanenbaum sobre princípios fundamentais de sistemas e processamento distribuído."
  type: "textbook"
  access: "free"
  language: "en"
  organization: "Distributed Systems Net"

- name: "DataCamp"
  url: "https://www.datacamp.com/"
  description: "Plataforma de aprendizagem interativa com trilhas completas de engenharia de dados, Apache Spark e Big Data."
  type: "course"
  access: "freemium"
  language: "en"
  organization: "DataCamp"

- name: "Google Cloud Big Data Documentation"
  url: "https://cloud.google.com/docs"
  description: "Guias técnicos e padrões de arquitetura para análise de dados em escala de petabytes e processamento de fluxo com BigQuery."
  type: "reference"
  access: "free"
  language: "en"
  organization: "Google Cloud"
