- name: "STIL (Simpósio Brasileiro de Tecnologia da Informação e da Linguagem Humana)"
  url: "https://sol.sbc.org.br/index.php/stil"
  description: "Principal evento científico do Brasil dedicado a pesquisas em processamento de linguagem natural e linguística computacional."
  type: "conference"
  access: "paid"
  language: "pt-BR"
  organization: "Sociedade Brasileira de Computação"

- name: "ACL (Annual Meeting of the Association for Computational Linguistics)"
  url: "https://www.aclweb.org/portal/"
  description: "Principal conferência internacional de apresentação de pesquisas e avanços em todas as áreas do processamento de linguagem natural."
  type: "conference"
  access: "paid"
  language: "en"
  organization: "Association for Computational Linguistics"

- name: "EMNLP (Empirical Methods in Natural Language Processing)"
  url: "https://sigdat.org/"
  description: "Conferência anual de destaque internacional voltada a abordagens empíricas e baseadas em dados em processamento de língua natural."
  type: "conference"
  access: "paid"
  language: "en"
  organization: "ACL SIGDAT"

- name: "NAACL (North American Chapter of the ACL)"
  url: "https://naacl.org/"
  description: "Conferência de grande porte focada em pesquisas de linguagem natural organizada pelo comitê regional das Américas da ACL."
  type: "conference"
  access: "paid"
  language: "en"
  organization: "NAACL"
