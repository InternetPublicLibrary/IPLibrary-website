- name: "Computational Linguistics"
  url: "https://direct.mit.edu/coli"
  description: "Periódico científico oficial da ACL de acesso aberto publicado pela MIT Press, referência primordial em linguística computacional."
  type: "journal"
  access: "free"
  language: "en"
  organization: "Association for Computational Linguistics"

- name: "Transactions of the Association for Computational Linguistics (TACL)"
  url: "https://transacl.org/"
  description: "Periódico acadêmico de acesso aberto com revisão contínua por pares focado em métodos teóricos e empíricos de PLN."
  type: "journal"
  access: "free"
  language: "en"
  organization: "Association for Computational Linguistics"

- name: "Natural Language Engineering"
  url: "https://www.cambridge.org/core/journals/natural-language-engineering"
  description: "Periódico científico revisado por pares da Cambridge University Press voltado a aspectos práticos e engenharia de sistemas de linguagem."
  type: "journal"
  access: "paid"
  language: "en"
  organization: "Cambridge University Press"

- name: "Journal of the Brazilian Computer Society (JBCS)"
  url: "https://journals-sol.sbc.org.br/index.php/jbcs"
  description: "Revista científica da SBC que publica pesquisas avaliadas por pares incluindo tópicos de processamento de língua natural."
  type: "journal"
  access: "free"
  language: "en"
  organization: "Sociedade Brasileira de Computação"
