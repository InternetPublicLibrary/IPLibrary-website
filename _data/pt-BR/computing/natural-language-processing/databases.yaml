- name: "ACL Anthology"
  url: "https://aclanthology.org/"
  description: "Acervo digital aberto contendo artigos científicos e publicações de todas as principais conferências de PLN do mundo."
  type: "database"
  access: "free"
  language: "en"
  organization: "Association for Computational Linguistics"

- name: "WordNet"
  url: "https://wordnet.princeton.edu/"
  description: "Grande base de dados lexical da língua inglesa que agrupa substantivos, verbos, adjetivos e advérbios em conjuntos de sinônimos cognitivos."
  type: "database"
  access: "free"
  language: "en"
  organization: "Princeton University"

- name: "Universal Dependencies"
  url: "https://universaldependencies.org/"
  description: "Projeto e base de dados internacional de anotações sintáticas consistentes entre mais de uma centena de idiomas, incluindo o português."
  type: "database"
  access: "free"
  language: "en"
  organization: "Universal Dependencies Consortium"

- name: "Hugging Face Models"
  url: "https://huggingface.co/models"
  description: "Repositório global de modelos pré-treinados, tokenizadores e representações vetoriais para tarefas de linguagem natural."
  type: "database"
  access: "free"
  language: "en"
  organization: "Hugging Face"
