- name: "Guia Foca GNU/Linux"
  url: "https://www.guiafoca.org/"
  description: "Um dos mais completos e tradicionais manuais em português para aprendizado e administração de sistemas operacionais Linux."
  type: "textbook"
  access: "free"
  language: "pt-BR"
  organization: "Gleydson Mazioli da Silva"

- name: "Operating Systems: Three Easy Pieces (OSTEP)"
  url: "https://pages.cs.wisc.edu/~remzi/OSTEP/"
  description: "Livro-texto didático e aberto cobrindo virtualização de CPU e memória, concorrência e sistemas de arquivos."
  type: "textbook"
  access: "free"
  language: "en"
  organization: "University of Wisconsin-Madison"

- name: "MIT 6.1810: Operating System Engineering"
  url: "https://pdos.csail.mit.edu/6.828/"
  description: "Disciplina aberta do MIT com laboratórios práticos focados no desenvolvimento do kernel didático xv6."
  type: "course"
  access: "free"
  language: "en"
  organization: "Massachusetts Institute of Technology"

- name: "The Linux Command Line"
  url: "https://linuxcommand.org/"
  description: "Livro didático aberto ensinando uso da linha de comando shell, pipelines e scripts em sistemas Unix-like."
  type: "textbook"
  access: "free"
  language: "en"
  organization: "William Shotts"
