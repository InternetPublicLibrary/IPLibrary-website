- name: "ImageNet"
  url: "https://image-net.org/"
  description: "Base de dados visual em larga escala organizada segundo a taxonomia do WordNet para treinamento e avaliação de modelos de visão."
  type: "database"
  access: "free"
  language: "en"
  organization: "Stanford Vision Lab"

- name: "CVF Open Access"
  url: "https://openaccess.thecvf.com/"
  description: "Repositório científico aberto com artigos completos e anais das conferências CVPR, ICCV e WACV."
  type: "database"
  access: "free"
  language: "en"
  organization: "Computer Vision Foundation"

- name: "Kaggle Datasets"
  url: "https://www.kaggle.com/datasets"
  description: "Plataforma pública com milhares de conjuntos de dados anotados de imagens e vídeos para desafios de visão computacional."
  type: "database"
  access: "free"
  language: "en"
  organization: "Kaggle"

- name: "SBC OpenLib (SOL)"
  url: "https://sol.sbc.org.br/"
  description: "Biblioteca digital da SBC que reúne os anais e artigos de todas as edições da conferência SIBGRAPI."
  type: "database"
  access: "free"
  language: "pt-BR"
  organization: "Sociedade Brasileira de Computação"
