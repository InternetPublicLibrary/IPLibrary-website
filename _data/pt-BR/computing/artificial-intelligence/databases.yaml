- name: "SBC OpenLib (SOL)"
  url: "https://sol.sbc.org.br/"
  description: "Biblioteca digital aberta da Sociedade Brasileira de Computação com anais e publicações de conferências nacionais em IA."
  type: "database"
  access: "free"
  language: "pt-BR"
  organization: "Sociedade Brasileira de Computação"

- name: "Hugging Face Datasets"
  url: "https://huggingface.co/datasets"
  description: "Repositório comunitário global que fornece acesso a dezenas de milhares de conjuntos de dados para treinamento e avaliação de modelos de IA."
  type: "database"
  access: "free"
  language: "en"
  organization: "Hugging Face"

- name: "UCI Machine Learning Repository"
  url: "https://archive.ics.uci.edu/"
  description: "Coleção histórica de bases de dados curadas utilizada pela comunidade científica para experimentação e benchmarking de modelos de IA."
  type: "database"
  access: "free"
  language: "en"
  organization: "University of California, Irvine"

- name: "Kaggle Datasets"
  url: "https://www.kaggle.com/datasets"
  description: "Plataforma pública que reúne centenas de milhares de conjuntos de dados abertos para experimentação em inteligência artificial."
  type: "database"
  access: "free"
  language: "en"
  organization: "Kaggle"

- name: "OpenReview"
  url: "https://openreview.net/"
  description: "Repositório científico e plataforma de revisão por pares aberta para publicações das principais conferências de IA do mundo."
  type: "database"
  access: "free"
  language: "en"
  organization: "OpenReview"
