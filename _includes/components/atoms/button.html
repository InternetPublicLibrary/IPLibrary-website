<button type="{{ include.type | default: 'button' }}"
  class="px-4 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors {{ include.class }}"
  {% if include.id %}id="{{ include.id }}" {% endif %} {% if include.onclick %}onclick="{{ include.onclick }}" {% endif
  %}>
  {{ include.text }}
</button>
