<!--
  Wiki Summary Box Molecule
  Displays a Wikipedia summary with thumbnail
  
  Usage:
  {% include components/molecules/wiki-summary-box.html
    id="wiki-summary-box"
  %}
-->

<div id="{{ include.id | default: 'wiki-summary-box' }}" class="bg-gray-50 rounded-lg p-4 border border-gray-200">
    <div class="flex items-start gap-4">
        <i class="fab fa-wikipedia-w text-gray-600 text-2xl flex-shrink-0"></i>
        <div id="wiki-summary-content" class="flex-1">
            <p class="text-gray-500">
                {% if page.lang == 'pt-BR' %}
                Pesquise um tema para ver o resumo da Wikipedia...
                {% else %}
                Search for a topic to see its Wikipedia summary...
                {% endif %}
            </p>
        </div>
    </div>
</div>

<script>
    async function fetchWikiSummary(query) {
        const container = document.getElementById('wiki-summary-content');
        if (!container) return;

        container.innerHTML = '<div class="animate-pulse h-4 bg-gray-200 rounded w-3/4"></div>';

        const lang = document.documentElement.lang?.split('-')[0] || 'en';
        const endpoint = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`;

        try {
            const response = await fetch(endpoint);
            if (response.ok) {
                const data = await response.json();
                const readMore = lang === 'pt' ? 'Ler mais na Wikipedia →' : 'Read more on Wikipedia →';
                container.innerHTML = `
                    <h4 class="font-semibold text-gray-800 mb-1">${data.title}</h4>
                    <p class="text-sm text-gray-600 line-clamp-3">${data.extract}</p>
                    ${data.thumbnail ? `<img src="${data.thumbnail.source}" alt="${data.title}" class="mt-3 rounded-lg max-h-32 object-cover">` : ''}
                    <a href="${data.content_urls?.desktop?.page || '#'}" target="_blank" class="text-sm text-blue-600 hover:underline mt-2 inline-block">
                        ${readMore}
                    </a>
                `;
            } else {
                const notFound = lang === 'pt' ? `Artigo não encontrado para "${query}"` : `No Wikipedia article found for "${query}"`;
                container.innerHTML = `<p class="text-gray-500">${notFound}</p>`;
            }
        } catch (error) {
            console.error('Wiki summary error:', error);
            const errorMsg = lang === 'pt' ? 'Erro ao carregar resumo da Wikipedia' : 'Could not load Wikipedia summary';
            container.innerHTML = `<p class="text-gray-500">${errorMsg}</p>`;
        }
    }
</script>
